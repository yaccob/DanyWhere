# DanyWhere's model offer, compiled into the app (see model_selection.rs).
#
# catalog/catalog.json stays a verbatim copy of Handy's model package; this
# file only picks from it. Ids are catalog ids. Capabilities (translation,
# streaming, language detection) come from the catalog, not from here.

# GitHub releases of the mirror repository. A model file lives at
# {mirror}/{id}-{first 12 characters of the catalog revision}/{filename}.
# Files are tried there first, then on Hugging Face.
mirror = "https://github.com/yaccob/DanyWhere-models/releases/download"

# Offered models, best first. Chosen for dictation on a laptop: fast enough on
# a normal MacBook, a small selection rather than the whole catalog, and every
# file on the mirror, so each below GitHub's 2 GiB per release file.
# Onboarding recommends a model per spoken language with the catalog's own
# logic, limited to this offer; "recommended" marks the general favourites.

[[offered]]
id = "parakeet-ultra"
recommended = true # fast, 25 European languages; Handy's pick for German + English

[[offered]]
id = "whisper-large-v3-turbo"
recommended = true # 100 languages; cannot translate

[[offered]]
id = "canary-1b-v2"
recommended = false # translates to English, 25 European languages

[[offered]]
id = "parakeet-unified-en-0.6b"
recommended = false # English only, live preview

[[offered]]
id = "whisper-small"
recommended = false # lighter Whisper, translates to English from 99 languages

[[offered]]
id = "canary-180m-flash"
recommended = false # tiny, en/de/es/fr
