name: "Release (DanyWhere, macOS)"

# DanyWhere releases: signed with Developer ID and notarized, Apple silicon
# only. Handy's release.yml (all platforms) stays untouched so upstream merges
# don't conflict; it is disabled in the repository settings.
#
# Tags are `danywhere-v<version>`: the clone also holds Handy's `v*` tags
# (fetched from upstream), and DanyWhere's own version numbers would collide
# with them.
on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `danywhere-v${{ steps.get-version.outputs.version }}`,
              target_commitish: context.sha,
              name: `DanyWhere ${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-26" # Apple silicon; macOS 26 for the Apple Intelligence SDK
      target: "aarch64-apple-darwin"
      build-args: "--target aarch64-apple-darwin"
      sign-binaries: true
      asset-prefix: "danywhere"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit
