ans-serif" font-size="13" lengthAdjust="spacing" textLength="138.0107" x="394.9009" y="137.9375">vous &#234;tes &#224; ce moment.</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="208.4131" x="160.4878" y="75.7969"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.4131" x="172.4878" y="100.9287">Un enregistrement se termine</text><polygon fill="#182327" points="177.7515,165.6924,351.6372,165.6924,363.6372,197.8896,351.6372,230.0869,177.7515,230.0869,165.7515,197.8896,177.7515,165.6924" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.6201" x="177.7515" y="178.8242">&#171;&#160;Choisir le profil selon</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.3135" x="177.7515" y="194.9229">l'application&#160;&#187; activ&#233;, et</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.8857" x="177.7515" y="211.0215">l'application au premier plan</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.5303" x="177.7515" y="227.1201">attribu&#233;e &#224; un profil&#160;?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="17.3481" x="148.4033" y="195.1348">oui</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.6899" x="363.6372" y="195.1348">non</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="127.5098" x="91.9966" y="240.0869"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.5098" x="103.9966" y="265.2188">Le profil de cette</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.9375" x="103.9966" y="281.3174">application</text><path d="M487.1353,240.0869 L487.1353,278.4587 L467.1353,282.4587 L487.1353,286.4587 L487.1353,324.8306 A0,0 0 0 0 487.1353,324.8306 L652.2524,324.8306 A0,0 0 0 0 652.2524,324.8306 L652.2524,250.0869 L642.2524,240.0869 L487.1353,240.0869 A0,0 0 0 0 487.1353,240.0869" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M642.2524,240.0869 L642.2524,250.0869 L652.2524,250.0869 L642.2524,240.0869" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1816" x="493.1353" y="257.2808">Sous Linux, DanyWhere</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.0117" x="493.1353" y="272.2295">ne voit pas l'application</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.4863" x="493.1353" y="287.1782">au premier plan&#160;: c'est</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.4463" x="493.1353" y="302.127">toujours ce qu'affiche</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.1172" x="493.1353" y="317.0757">&#171;&#160;En cours d'utilisation&#160;&#187;.</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="186.9961" x="280.1392" y="246.3108"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.0928" x="292.1392" y="271.4426">Ce qu'affiche &#171;&#160;En cours</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.9961" x="292.1392" y="287.5413">d'utilisation&#160;&#187;&#160;: &#171;&#160;R&#233;glages</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6543" x="292.1392" y="303.6399">de base&#160;&#187; ou un profil</text><polygon fill="#182327" points="195.812,362.8306,333.5767,362.8306,345.5767,386.9785,333.5767,411.1265,195.812,411.1265,183.812,386.9785,195.812,362.8306" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.7646" x="195.812" y="375.9624">Pour chaque r&#233;glage&#160;:</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.5137" x="195.812" y="392.061">qu'affiche le profil</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.2822" x="195.812" y="408.1597">en dessous&#160;?</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="125.9512" x="17" y="474.7178"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.9512" x="29" y="499.8496">La valeur propre</text><text fill="#F2F6F7" 