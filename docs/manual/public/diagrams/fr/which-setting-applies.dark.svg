 sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.9243" x="367.2905" y="632.0063">DanyWhere refait ce que ce profil</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.7407" x="367.2905" y="646.9551">fait autrement&#160;: transcription,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.3652" x="367.2905" y="661.9038">post-traitement ou seulement</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.2324" x="367.2905" y="676.8525">&#171;&#160;Ajouter &#224; la fin&#160;&#187;. Seulement avec</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.5044" x="367.2905" y="691.8013">&#171;&#160;Choisir le profil selon</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.5518" x="367.2905" y="706.75">l'application&#160;&#187; activ&#233;.</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="153.1924" x="188.0981" y="621.6113"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.1924" x="200.0981" y="646.7432">La dict&#233;e se poursuit</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.2686" x="200.0981" y="662.8418">avec ces valeurs</text><ellipse cx="264.6943" cy="745.5049" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="264.6943" cy="745.5049" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CF