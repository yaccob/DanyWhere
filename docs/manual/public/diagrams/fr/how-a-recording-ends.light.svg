ict&#233;es pr&#233;c&#233;dentes de la</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.3232" x="110.9084" y="725.5256">m&#234;me fen&#234;tre vont comme contexte</text><polygon fill="#FFFFFF" points="149.4153,626.6235,295.7249,626.6235,307.7249,642.7222,295.7249,658.8208,149.4153,658.8208,137.4153,642.7222,149.4153,626.6235" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="17.3481" x="226.5701" y="671.0146">oui</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.3096" x="149.4153" y="639.7554">&#171;&#160;Envoyer le contexte&#160;&#187;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.6133" x="149.4153" y="655.854">pour cette fin&#160;?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.6899" x="307.7249" y="639.9673">non</text><rect fill="#F3F5F5" height="56.1973" rx="10" ry="10" style="stroke:#A9BABE;stroke-width:1.25;" width="168.7373" x="388.2317" y="550.4263"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.7373" x="400.2317" y="575.5581">Pas de post-traitement,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.8477" x="400.2317" y="591.6567">pas de contexte</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="235.6885" x="229.741" y="802.4924"/><text fill="#0F0F0F" font-family=