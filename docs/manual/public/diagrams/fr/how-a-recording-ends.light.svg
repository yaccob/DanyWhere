es de la</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.3232" x="91.6104" y="739.7786">m&#234;me fen&#234;tre vont comme contexte</text><polygon fill="#FFFFFF" points="130.1172,640.8765,276.4268,640.8765,288.4268,656.9751,276.4268,673.0737,130.1172,673.0737,118.1172,656.9751,130.1172,640.8765" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="17.3481" x="207.272" y="685.2676">oui</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.3096" x="130.1172" y="654.0083">&#171;&#160;Envoyer le contexte&#160;&#187;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.6133" x="130.1172" y="670.1069">pour cette fin&#160;?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.6899" x="288.4268" y="654.2202">non</text><rect fill="#F3F5F5" height="56.1973" rx="10" ry="10" style="stroke:#A9BABE;stroke-width:1.25;" width="168.7373" x="368.9336" y="564.6792"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.7373" x="380.9336" y="589.811">Pas de post-traitement,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.8477" x="380.9336" y="605.9097">pas de contexte</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="235.6885" x="210.4429" y="816.7454"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation S