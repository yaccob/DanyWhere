<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="948px" preserveAspectRatio="none" style="width:653px;height:948px;" version="1.1" viewBox="0 0 653 948" width="653px" zoomAndPan="magnify"><defs/><g><ellipse cx="328.2871" cy="26" fill="#1E3A44" rx="10" ry="10" style="stroke:#1E3A44;stroke-width:1;"/><path d="M26,56 L26,140.7437 L226.9116,140.7437 L226.9116,66 L216.9116,56 L26,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M216.9116,56 L216.9116,66 L226.9116,66 L216.9116,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.1753" x="32" y="73.1938">&#171;&#160;Copier la derni&#232;re</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9116" x="32" y="88.1426">transcription&#160;&#187; le termine aussi,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7534" x="32" y="103.0913">comme son raccourci de d&#233;but</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3062" x="32" y="118.04">le ferait, et met le texte dans</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7153" x="32" y="132.9888">le presse-papiers</text><path d="M429.6626,63.4744 L429.6626,133.2693 L608.9224,133.2693 L608.9224,73.4744 L598.9224,63.4744 L429.6626,63.4744" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M598.9224,63.4744 L598.9224,73.4744 L608.9224,73.4744 L598.9224,63.4744" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.2598" x="435.6626" y="80.6682">Sous Linux, la combinaison</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.1235" x="435.6626" y="95.6169">propre d'un raccourci de fin</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.9526" x="435.6626" y="110.5657">n'est pas prise, et &#201;chap</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.3218" x="435.6626" y="125.5144">n'annule pas</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="182.751" x="236.9116" y="78.3225"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.751" x="248.9116" y="103.4543">Un enregistrement tourne</text><polygon fill="#FFFFFF" points="287.2646,170.7437,369.3096,170.7437,381.3096,186.8423,369.3096,202.9409,287.2646,202.9409,275.2646,186.8423,287.2646,170.7437" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.0449" x="287.2646" y="183.8755">Qu'est-ce qui</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.1445" x="287.2646" y="199.9741">le termine&#160;?</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="122.041" x="20.8013" y="292.04"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.041" x="32.8013" y="317.1719">Ce raccourci de</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.1445" x="32.8013" y="333.2705">fin le termine</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="164.8477" x="172.6299" y="306.9888"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.3926" x="184.6299" y="332.1206">Le raccourci de fin</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="140.8477" x="184.6299" y="348.2192">de m&#234;me combinaison</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.6035" x="184.6299" y="364.3179">le termine, s'il existe</text><rect fill="#E7F3F5" height="120.5918" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="130.6201" x="357.4775" y="321.9375"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.0654" x="369.4775" y="347.0693">Sa fin &#171;&#160;Lorsqu'il</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.6201" x="369.4775" y="363.168">est maintenu&#160;&#187; le</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0342" x="369.4775" y="379.2666">termine, avec</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" tex