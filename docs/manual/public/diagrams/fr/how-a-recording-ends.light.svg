"71.5928" x="294.541" y="339.595">Les valeurs</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.248" x="294.541" y="355.6936">de ce</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.2549" x="294.541" y="371.7922">raccourci de</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.7031" x="294.541" y="387.8909">maintien le</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.3584" x="294.541" y="403.9895">terminent</text><rect fill="#E7F3F5" height="104.4932" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="132.958" x="630.3062" y="299.5144"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.7168" x="642.3062" y="324.6462">&#171;&#160;Instruction&#160;&#187;&#160;:</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.958" x="642.3062" y="340.7449">ce que vous dites</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.4063" x="642.3062" y="356.8435">maintenant dit au</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="642.3062" y="372.9421">post-traitement</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5928" x="642.3062" y="389.0408">quoi faire</text><polygon fill="#FF