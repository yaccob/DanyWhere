<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="933px" preserveAspectRatio="none" style="width:696px;height:933px;" version="1.1" viewBox="0 0 696 933" width="696px" zoomAndPan="magnify"><defs/><g><ellipse cx="347.5852" cy="26" fill="#1E3A44" rx="10" ry="10" style="stroke:#1E3A44;stroke-width:1;"/><path d="M45.2981,56 L45.2981,140.7437 L246.2097,140.7437 L246.2097,66 L236.2097,56 L45.2981,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M236.2097,56 L236.2097,66 L246.2097,66 L236.2097,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.1753" x="51.2981" y="73.1938">&#171;&#160;Copier la derni&#232;re</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9116" x="51.2981" y="88.1426">transcription&#160;&#187; le termine aussi,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7534" x="51.2981" y="103.0913">comme son raccourci de d&#233;but</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3062" x="51.2981" y="118.04">le ferait, et met le texte dans</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7153" x="51.2981" y="132.9888">le presse-papiers</text><path d="M448.9607,63.4744 L448.9607,133.2693 L628.2205,133.2693 L628.2205,73.4744 L618.2205,63.4744 L448.9607,63.4744" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M618.2205,63.4744 L618.2205,73.4744 L628.2205,73.4744