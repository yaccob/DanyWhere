.5994,606.1636,665.7473,594.1636,689.8953,387.6294,689.8953,375.6294,665.7473,387.6294,641.5994" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.5342" x="387.6294" y="654.7312">Un raccourci d'instruction press&#233;,</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.7373" x="387.6294" y="670.8298">ou &#171;&#160;Post-traitement&#160;&#187;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.834" x="387.6294" y="686.9285">sur &#171;&#160;Toujours&#160;&#187;&#160;?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="17.3481" x="358.2813" y="662.9924">oui</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.6899" x="606.1636" y="662.9924">non</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="199.417" x="265.9209" y="699.8953"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.5098" x="277.9209" y="725.0271">Post-trait&#233; avec les prompts</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.417" x="277.9209" y="741.1257">actifs du profil et l'instruction</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.0791" x="277.9209" y="757.2244">orale, s'il y en a une</text><rect fill="#E7F3F5" height