<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1099px" preserveAspectRatio="none" style="width:972px;height:1099px;" version="1.1" viewBox="0 0 972 1099" width="972px" zoomAndPan="magnify"><defs/><g><ellipse cx="490.8965" cy="26" fill="#1E3A44" rx="10" ry="10" style="stroke:#1E3A44;stroke-width:1;"/><path d="M188.6094,56 L188.6094,140.7437 L389.521,140.7437 L389.521,66 L379.521,56 L188.6094,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M379.521,56 L379.521,66 L389.521,66 L379.521,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.1753" x="194.6094" y="73.1938">&#171;&#160;Copier la derni&#232;re</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9116" x="194.6094" y="88.1426">transcription&#160;&#187; le termine aussi,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7534" x="194.6094" y="103.0913">comme son raccourci de d&#233;but</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3062" x="194.6094" y="118.04">le ferait, et met le texte dans</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7153" x="194.6094" y="132.9888">le presse-papiers</text><path d="M592.272,56 L592.272,140.7437 L771.5317,140.7437 L771.5317,66 L761.5317,56 L592.272,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M761.5317,56 L761.5317,66 L771.5317,66 L761.5317,56" fill="#F3F5F5" styl