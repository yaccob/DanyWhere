<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="863px" preserveAspectRatio="none" style="width:594px;height:863px;" version="1.1" viewBox="0 0 594 863" width="594px" zoomAndPan="magnify"><defs/><g><ellipse cx="235.3923" cy="26" fill="#1E3A44" rx="10" ry="10" style="stroke:#1E3A44;stroke-width:1;"/><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="264.4746" x="103.155" y="56"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.4746" x="115.155" y="81.1318">Un raccourci de d&#233;but ou de maintien&#160;:</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.748" x="115.155" y="97.2305">l'enregistrement tourne</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="138.3994" x="166.1926" y="132.1973"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.3994" x="178.1926" y="157.3291">Vous dites le texte</text><path d="M379.6042,200.4458 L379.6042,216.3945 L359.6042,220.3945 L379.6042,224.3945 L379.6042,240.3433 A0,0 0 0 0 379.6042,240.3433 L509.0222,240.3433 A0,0 0 0 0 509.0222,240.3433 L509.0222,210.4458 L499.0222,200.4458 L379.6042,200.4458 A0,0 0 0 0 379.6042,200.4458" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M499.0222,200.4458 L499.0222,210.4458 L509.0222,210.4458 L499.0222,200.4458" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.418" x="385.6042" y="217.6396">&#201;chap annule tout,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.498" x="385.6042" y="232.5884">texte et instruction</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="248.4238" x="111.1804" y="192.2959"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.4238" x="123.1804" y="217.4277">Un raccourci d'instruction, p. ex. &#8677;&#160;:</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.8789" x="123.1804" y="233.5264">l'overlay affiche &#171;&#160;Instruction&#160;&#187;</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="438.7847" x="17" y="268.4932"/><rect fill="#E7F3F5" height="88.3945" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="133.7441" x="29" y="378.2397"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.9512" x="41" y="403.3716">Le mod&#232;le vocal</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.7031" x="41" y="419.4702">transcrit le texte,</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.4863" x="41" y="435.5688">puis l'overlay</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.7441" x="41" y="451.6675">affiche une coche</text><rect fill="#E7F3F5" height="88.3945" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="135.6104" x="250.5938" y="294.4932"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.3721" x="262.5938" y="319.625">Vous dites</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.6104" x="262.5938" y="335.7236">l'instruction, p. ex.</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.4824" x="262.5938" y="351.8223">&#171;&#160;traduis ceci</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.2891" x="262.5938" y="367.9209">en polonais&#160;&#187;</text><polygon fill="#FFFFFF" points="274.0337,417.8877,362.7642,417.8877,374.7642,433.9863,362.7642,450.085,274.0337,450.085,262.0337,433.9863,274.0337,417.8877" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.8203" x="274.0337" y="431.0195">Appui bref</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="88.7305" x="274.0337" y="447.1182">ou maintenu&#160;?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="22.4009" x="239.6328" y="431.2314">bref</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.479" x="374.7642" y="431.2314">maintenu</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="102.5791" x="200.7441" y="460.085"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.5791" x="212.7441" y="485.2168">Un raccourci</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.248" x="212.7441" y="501.3154">de fin</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.0381" x="212.7441" y="517.4141">l'envoie</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="94.041" x="337.7437" y="460.085"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.041" x="349.7437" y="485.2168">Le rel&#226;cher</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.0381" x="349.7437" y="501.3154">l'envoie</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="438.7847" x="17" y="570.3809"/><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="253.1064" x="108.8391" y="596.3809"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.1064" x="120.8391" y="621.5127">Le mod&#232;le vocal transcrit l'instruction</text><path d="M375.1506,657.155 L375.1506,680.5781 L355.1506,684.5781 L375.1506,688.5781 L375.1506,712.0012 A0,0 0 0 0 375.1506,712.0012 L576.7922,712.0012 A0,0 0 0 0 576.7922,712.0012 L576.7922,667.155 L566.7922,657.155 L375.1506,657.155 A0,0 0 0 0 375.1506,657.155" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M566.7922,657.155 L566.7922,667.155 L576.7922,667.155 L566.7922,657.155" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.5107" x="381.1506" y="674.3489">Rien dit apr&#232;s le raccourci&#160;:</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.6416" x="381.1506" y="689.2976">les prompts seuls. Pas de texte</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.5581" x="381.1506" y="704.2463">avant&#160;: l'instruction seule.</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="239.5166" x="115.634" y="656.4795"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.5166" x="127.634" y="681.6113">Post-traitement&#160;: les prompts actifs</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="156.748" x="127.634" y="697.71">du profil, puis l'instruction</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="239.5713" x="115.6067" y="732.6768"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.5713" x="127.6067" y="757.8086">&#171;&#160;Ajouter &#224; la fin&#160;&#187; de la fin, ins&#233;r&#233;,</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.5547" x="127.6067" y="773.9072">enregistr&#233; dans l'&#171;&#160;Historique&#160;&#187;</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLen