89.6555" y="256.4939">die &#8222;Grundeinstellungen&#8220;</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.3789" x="289.6555" y="272.5925">oder ein Profil</text><polygon fill="#FFFFFF" points="173.4871,331.7832,333.0037,331.7832,345.0037,347.8818,333.0037,363.9805,173.4871,363.9805,161.4871,347.8818,173.4871,331.7832" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.5166" x="173.4871" y="344.915">F&#252;r jede Einstellung: Was</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6406" x="173.4871" y="361.0137">zeigt das Profil darunter?</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="125.9307" x="17" y="433.1309"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.9307" x="29" y="458.2627">Der eigene Wert</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.3584" x="29" y="474.3613">des Profils</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="115.8066" x="162.9307" y="418.1821"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.8066" x="174.9307" y="443.314">Der Grundwert</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="115.8066" x="310.1821" y="433.1309"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.8066" x="322.1821" y="458.2627">Der Grundwert</text><polygon fill="#FFFFFF" points="253.2454,509.3281,253.2454,509.3281,265.2454,521.3281,253.2454,533.3281,253.2454,533.3281,241.2454,521.3281,253.2454,509.3281" style="stroke:#3C9CAA;stroke-width:1.25;"/><path d="M391.0623,543.3281 L391.0623,596.6487 L371.0623,600.6487 L391.0623,604.6487 L391.0623,657.9692 A0,0 0 0 0 391.0623,657.9692 L623.801,657.9692 A0,0 0 0 0 623.801,657.9692 L623.801,553.3281 L613.801,543.3281 L391.0623,543.3281 A0,0 0 0 0 391.0623,543.3281" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M613.801,543.3281 L613.801,553.3281 L623.801,553.3281 L613.801,543.3281" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.458" x="397.0623" y="560.522">Geht sein Text in eine</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9497" x="397.0623" y="575.4707">Anwendung mit einem anderen</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.4053" x="397.0623" y="590.4194">Profil, macht DanyWhere neu,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.5234" x="397.0623" y="605.3682">was dieses Profil anders macht:</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.3779" x="397.0623" y="620.3169">Transkription, Nachbearbeitung</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.0825" x="397.0623" y="635.2656">oder nur &#8222;Anh&#228;ngen&#8220;. Nur mit</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7388" x="397.0623" y="650.2144">&#8222;Profil nach Anwendung w&#228;hlen&#8220; ein.</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="235.6338" x="135.4285" y="580.5994"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.6338" x="147.4285" y="605.7312">Das Diktat l&#228;uft mit diesen Werten</text><ellipse cx="253.2454" cy="688.9692" fill="none" rx="11" ry="11" style="stroke:#1E3A44;stroke-width:1;"/><ellipse cx="253.2454" cy="688.9692" fill="#1E3A44" rx="6" ry="6" style="stroke:#1E3A44;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="253.2454" x2="253.2454" y1="36" y2="68.3225"/><polygon fill="#3C9CAA" points="249.2454,58.3225,253.2454,68.3225,257.2454,58.3225,253.2454,62.3225" style="stroke:#3C9CAA;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="140.4631" x2="130.4631" y1="174.8916" y2="174.8916"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="130.4631" x2="130.4631" y1="174.8916" y2="209.0396"/><polygon fill="#3C9CAA" points="126.4631,199.0396,130.4631,209.0396,134.4631,199.0396,130.4631,203.0396" style="stroke:#3C9CAA;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="366.0276" x2="376.0276" y1="174.8916" y2="174.8916"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="376.0276" x2="376.0276" y1="174.8916" y2="215.2634"/><polygon fill="#3C9CAA" points="372.0276,205.2634,376.0276,215.2634,380.0276,205.2634,376.0276,209.2634" style="stroke:#3C9CAA;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="130.4631" x2="130.4631" y1="265.2368" y2="311.7832"/><polygon fill="#3C9CAA" points="126.4631,301.7832,130.4631,311.7832,134.4631,301.7832,130.4631,305.7832"