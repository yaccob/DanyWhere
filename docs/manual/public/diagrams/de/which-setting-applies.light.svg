<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="716px" preserveAspectRatio="none" style="width:695px;height:716px;" version="1.1" viewBox="0 0 695 716" width="695px" zoomAndPan="magnify"><defs/><g><ellipse cx="253.2454" cy="26" fill="#1E3A44" rx="10" ry="10" style="stroke:#1E3A44;stroke-width:1;"/><path d="M352.5725,46 L352.5725,84.3718 L332.5725,88.3718 L352.5725,92.3718 L352.5725,130.7437 A0,0 0 0 0 352.5725,130.7437 L555.6741,130.7437 A0,0 0 0 0 555.6741,130.7437 L555.6741,56 L545.6741,46 L352.5725,46 A0,0 0 0 0 352.5725,46" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M545.6741,46 L545.6741,56 L555.6741,56 L545.6741,46" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.6943" x="358.5725" y="63.1938">Schon beim Start wurde ein</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5107" x="358.5725" y="78.1426">Profil gew&#228;hlt, damit sein</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.1016" x="358.5725" y="93.0913">Sprachmodell laden kann. Es</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.1016" x="358.5725" y="108.04">entscheidet das Ende: Der Text</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.5615" x="358.5725" y="122.9888">geht dorthin, wo du dann bist.</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="158.6543" x="173.9182" y="68.3225"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6543" x="185.9182" y="93.4543">Eine Aufnahme endet</text><polygon fill="#FFFFFF" points="152.4631,150.7437,354.0276,150.7437,366.0276,174.8916,354.0276,199.0396,152.4631,199.0396,140.4631,174.8916,152.4631,150.7437" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.5645" x="152.4631" y="163.8755">&#8222;Profil nach Anwendung w&#228;hlen&#8220;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.3574" x="152.4631" y="179.9741">ein, und die Anwendung vorn</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6475" x="152.4631" y="196.0728">einem Profil zugeordnet?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="130.345" y="172.1367">ja</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="366.0276" y="172.1367">nein</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="126.7031" x="67.1116" y="209.0396"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.7031" x="79.1116" y="234.1714">Das Profil dieser</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.9512" x="79.1116" y="250.27">Anwendung</text><path d="