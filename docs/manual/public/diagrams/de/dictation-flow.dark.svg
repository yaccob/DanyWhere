<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1504px" preserveAspectRatio="none" style="width:630px;height:1504px;" version="1.1" viewBox="0 0 630 1504" width="630px" zoomAndPan="magnify"><defs/><g><ellipse cx="237.5903" cy="26" fill="#CFE9ED" rx="10" ry="10" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M326.397,46 L326.397,76.8975 L306.397,80.8975 L326.397,84.8975 L326.397,115.7949 A0,0 0 0 0 326.397,115.7949 L559.8594,115.7949 A0,0 0 0 0 559.8594,115.7949 L559.8594,56 L549.8594,46 L326.397,46 A0,0 0 0 0 326.397,46" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M549.8594,46 L549.8594,56 L559.8594,56 L549.8594,46" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2598" x="332.397" y="63.1938">Das Profil: Die Anwendung vorn</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.4624" x="332.397" y="78.1426">entscheidet (&#8222;Profil nach Anwendung</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7134" x="332.397" y="93.0913">w&#228;hlen&#8220;), sonst gilt &#8222;In Verwendung&#8220;.</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.9243" x="332.397" y="108.04">Beim Ende neu gew&#228;hlt.</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="137.6133" x="168.7837" y="60.8481"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.6133" x="180.7837" y="85.98">Starttaste dr&#252;cken</text><path d="M359.4727,136.4705 L359.4727,159.8936 L339.4727,163.8936 L359.4727,167.8936 L359.4727,191.3167 A0,0 0 0 0 359.4727,191.3167 L577.7578,191.3167 A0,0 0 0 0 577.7578,191.3167 L577.7578,146.4705 L567.7578,136.4705 L359.4727,136.4705 A0,0 0 0 0 359.4727,136.4705" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M567.7578,136.4705 L567.7578,146.4705 L577.7578,146.4705 L567.7578,136.4705" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.7852" x="365.4727" y="153.6643">Wie sie enden kann und was das</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2852" x="365.4727" y="168.613">Ende entscheidet: siehe &#8222;Wie eine</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7344" x="365.4727" y="183.5618">Aufnahme endet&#8220;</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="203.7646" x="135.708" y="135.7949"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="147.708" y="160.9268">Die Aufnahme l&#228;uft: Startton,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.1025" x="147.708" y="177.0254">das Overlay zeigt den Pegel</text><polygon fill="#182327" points="191.2871,236.0933,283.8936,236.0933,295.8936,248.0933,283.8936,260.0933,191.2871,260.0933,179.2871,248.0933,191.2871,236.0933" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.6064" x="191.2871" y="253.1758">Wie endet sie?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.7471" x="34.7383" y="215.4409">eine Endtaste, oder</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5488" x="34.7383" y="230.3896">eine gehaltene Starttaste</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="68.6563" x="34.7383" y="245.3384">losgelassen</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.2871" x="295.8936" y="230.3896">&#8222;Abbrechen-Tastenk&#252;rzel&#8220;</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="30.3291" x="295.8936" y="245.3384">(Esc)</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="218.5713" x="17" y="270.0933"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.5713" x="29" y="295.2251">Die Aufnahme stoppt: Stoppton</text><rect fill="#3D2224" height="56.1973" rx="10" ry="10" style="stroke:#F87171;stroke-width:1.25;" width="186.6475" x="255.5713" y="270.0933"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.1992" x="267.5713" y="295.2251">Abgebrochen: nichts wird</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.6475" x="267.5713" y="311.3237">transkribiert oder behalten</text><ellipse cx="348.895" cy="357.2905" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="348.895" cy="357.2905" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M365.2935,388.3911 L365.2935,404.3398 L345.2935,408.3398 L365.2935,412.3398 L365.2935,428.2886 A0,0 0 0 0 365.2935,428.2886 L580.627,428.2886 A0,0 0 0 0 580.627,428.2886 L580.627,398.3911 L570.627,388.3911 L365.2935,388.3911 A0,0 0 0 0 365.2935,388.3911" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M570.627,388.3911 L570.627,398.3911 L580.627,398.3911 L570.627,388.3911" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.1226" x="371.2935" y="405.585">Wortlisten: Ein Modell, das sie</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3335" x="371.2935" y="420.5337">nimmt, wie Whisper, nutzt sie hier</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="215.4063" x="129.8872" y="388.2905"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.4063" x="141.8872" y="413.4224">Das Sprachmodell transkribiert</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="219.3232" x="127.9287" y="563.7324"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.3232" x="139.9287" y="588.8643">Fr&#252;here Diktate aus demselben</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.9854" x="139.9287" y="604.9629">Fenster gehen als Kontext mit</text><polygon fill="#182327" points="181.5527,506.0608,293.6279,506.0608,305.6279,522.1594,293.6279,538.2581,181.5527,538.2581,169.5527,522.1594,181.5527,506.0608" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="241.5903" y="550.4519">ja</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.6201" x="181.5527" y="519.1926">&#8222;Kontext senden&#8220;</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.0752" x="181.5527" y="535.2913">bei diesem Ende?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="305.6279" y="519.4045">nein</text><path d="M377.3555,678.7039 L377.3555,702.127 L357.3555,706.127 L377.3555,710.127 L377.3555,733.55 A0,0 0 0 0 377.3555,733.55 L588.3853,733.55 A0,0 0 0 0 588.3853,733.55 L588.3853,688.7039 L578.3853,678.7039 L377.3555,678.7039 A0,0 0 0 0 377.3555,678.7039" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M578.3853,678.7039 L578.3853,688.7039 L588.3853,688.7039 L578.3853,678.7039" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.9897" x="383.3555" y="695.8977">Schl&#228;gt das fehl, geht die</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.0298" x="383.3555" y="710.8464">Transkription unver&#228;ndert weiter,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7725" x="383.3555" y="725.7952">und eine Meldung sagt, warum</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="239.5303" x="117.8252" y="661.9297"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="204.6748" x="129.8252" y="687.0615">Das Modell der Nachbearbeitung</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.3438" x="129.8252" y="703.1602">bearbeitet den Text: die aktiven</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.5303" x="129.8252" y="719.2588">Prompts der Reihe nach, die Wort-</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.1025" x="129.8252" y="735.3574">listen als bekannte Begriffe</text><polygon fill="#182327" points="133.6909,448.3892,341.4897,448.3892,353.4897,464.4878,341.4897,480.5864,133.6909,480.5864,121.6909,464.4878,133.6909,448.3892" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="241.5903" y="492.7803">ja</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.7988" x="133.6909" y="461.521">Sagt das Ende &#8222;Nachbearbeiten&#8220;,</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.4541" x="133.6909" y="477.6196">und ist &#8222;Nachbearbeitung&#8220; ein?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="353.4897" y="461.7329">nein</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="175.7168" x="149.7319" y="792.3242"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.7168" x="161.7319" y="817.4561">Gespeichert im &#8222;Verlauf&#8220;</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="187.4063" x="214.3757" y="882.3203"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.9375" x="226.3757" y="907.4521">Der Text wartet, bis ein</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.4063" x="226.3757" y="923.5508">macOS-Dienst ihn einf&#252;gt,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.248" x="226.3757" y="939.6494">z. B. mit &#8222;Letzte</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.1855" x="226.3757" y="955.748">Transkription einf&#252;gen&#8220;</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="199.0889" x="208.5344" y="1020.6123"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.7715" x="220.5344" y="1045.7441">In der Zwischenablage oder</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-seri