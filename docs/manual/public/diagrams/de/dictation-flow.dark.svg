<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1527px" preserveAspectRatio="none" style="width:633px;height:1527px;" version="1.1" viewBox="0 0 633 1527" width="633px" zoomAndPan="magnify"><defs/><g><ellipse cx="237.5903" cy="26" fill="#CFE9ED" rx="10" ry="10" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M362.9692,46 L362.9692,76.8975 L342.9692,80.8975 L362.9692,84.8975 L362.9692,115.7949 A0,0 0 0 0 362.9692,115.7949 L596.4316,115.7949 A0,0 0 0 0 596.4316,115.7949 L596.4316,56 L586.4316,46 L362.9692,46 A0,0 0 0 0 362.9692,46" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M586.4316,46 L586.4316,56 L596.4316,56 L586.4316,46" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2598" x="368.9692" y="63.1938">Das Profil: Die Anwendung vorn</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.4624" x="368.9692" y="78.1426">entscheidet (&#8222;Profil nach Anwendung</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7134" x="368.9692" y="93.0913">w&#228;hlen&#8220;), sonst gilt &#8222;In Verwendung&#8220;.</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.9243" x="368.9692" y="108.04">Beim Ende neu gew&#228;hlt.</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="210.7578" x="132.2114" y="60.8481"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.7578" x="144.2114" y="85.98">Start- oder Haltetaste dr&#252;cken</text><path d="M359.4727,128.9961 L359.4727,159.8936 L339.4727,163.8936 L359.4727,167.8936 L359.4727,198.791 A0,0 0 0 0 359.4727,198.791 L583.5405,198.791 A0,0 0 0 0 583.5405,198.791 L583.5405,138.9961 L573.5405,128.9961 L359.4727,128.9961 A0,0 0 0 0 359.4727,128.9961" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M573.5405,128.9961 L573.5405,138.9961 L583.5405,138.9961 L573.5405,128.9961" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0679" x="365.4727" y="146.1899">Wie sie enden kann, was das Ende</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.146" x="365.4727" y="161.1387">entscheidet, und die gesprochene</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.418" x="365.4727" y="176.0874">Anweisung: siehe &#8222;Wie eine</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7344" x="365.4727" y="191.0361">Aufnahme endet&#8220;</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="203.7646" x="135.708" y="135.7949"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.7646" x="147.708" y="160.9268">Die Aufnahme l&#228;uft: Startton,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.1025" x="147.708" y="177.0254">das Overlay zeigt den Pegel</text><polygon fill="#182327" points="191.2871,242.8921,283.8936,242.8921,295.8936,254.8921,283.8936,266.8921,191.2871,266.8921,179.2871,254.8921,191.2871,242.8921" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.6064" x="191.2871" y="259.9746">Wie endet sie?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.7471" x="66.54" y="222.2397">eine Endtaste, oder</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.7217" x="66.54" y="237.1885">eine Haltetaste</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="68.6563" x="66.54" y="252.1372">losgelassen</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.2871" x="295.8936" y="237.1885">&#8222;Abbrechen-Tastenk&#252;rzel&#8220;</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="30.3291" x="295.8936" y="252.1372">(Esc)</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="218.5713" x="17" y="276.8921"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.5713" x="29" y="302.0239">Die Aufnahme stoppt: Stoppton</text><rect fill="#3D2224" height="56.1973" rx="10" ry="10" style="stroke:#F87171;stroke-width:1.25;" width="186.6475" x="255.5713" y="276.8921"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.1992" x="267.5713" y="302.0239">Abgebrochen: nichts wird</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.6475" x="267.5713" y="318.1226">transkribiert oder behalten</text><ellipse cx="348.895" cy="364.0894" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="348.895" cy="364.0894" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M365.2935,395.1899 L365.2935,411.1387 L345.2935,415.1387 L365.2935,419.1387 L365.2935,435.0874 A0,0 0 0 0 365.2935,435.0874 L580.627,435.0874 A0,0 0 0 0 580.627,435.0874 L580.627,405.1899 L570.627,395.1899 L365.2935,395.1899 A0,0 0 0 0 365.2935,395.1899" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M570.627,395.1899 L570.627,405.1899 L580.627,405.1899 L570.627,395.1899" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.1226" x="371.2935" y="412.3838">Wortlisten: Ein Modell, das sie</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3335" x="371.2935" y="427.3325">nimmt, wie Whisper, nutzt sie hier</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="215.4063" x="129.8872" y="395.0894"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.4063" x="141.8872" y="420.2212">Das Sprachmodell transkribiert</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="219.3232" x="127.9287" y="570.5313"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.3232" x="139.9287" y="595.6631">Fr&#252;here Diktate aus demselben</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.9854" x="139.9287" y="611.7617">Fenster gehen als Kontext mit</text><polygon fill="#182327" points="181.5527,512.8596,293.6279,512.8596,305.6279,528.9583,293.6279,545.0569,181.5527,545.0569,169.5527,528.9583,181.5527,512.8596" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="241.5903" y="557.2507">ja</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.6201" x="181.5527" y="525.9915">&#8222;Kontext senden&#8220;</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.0752" x="181.5527" y="542.0901">bei diesem Ende?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="305.6279" y="526.2034">nein</text><path d="M380.4795,693.552 L380.4795,716.9751 L360.4795,720.9751 L380.4795,724.9751 L380.4795,748.3982 A0,0 0 0 0 380.4795,748.3982 L591.5093,748.3982 A0,0 0 0 0 591.5093,748.3982 L591.5093,703.552 L581.5093,693.552 L380.4795,693.552 A0,0 0 0 0 380.4795,693.552" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M581.5093,693.552 L581.5093,703.552 L591.5093,703.552 L581.5093,693.552" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.9897" x="386.4795" y="710.7458">Schl&#228;gt das fehl, geht die</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.0298" x="386.4795" y="725.6946">Transkription unver&#228;ndert weiter,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7725" x="386.4795" y="740.6433">und eine Meldung sagt, warum</text><rect fill="#1D3A40" height="104.4932" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="245.7783" x="114.7012" y="668.7285"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="204.6748" x="126.7012" y="693.8604">Das Modell der Nachbearbeitung</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.3438" x="126.7012" y="709.959">bearbeitet den Text: die aktiven</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.7783" x="126.7012" y="726.0576">Prompts der Reihe nach, zuletzt die</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.8955" x="126.7012" y="742.1563">gesprochene Anweisung, die Wort-</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.1025" x="126.7012" y="758.2549">listen als bekannte Begriffe</text><polygon fill="#182327" points="137.6045,455.188,337.5762,455.188,349.5762,471.2866,337.5762,487.3853,137.6045,487.3853,125.6045,471.2866,137.6045,455.188" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="241.5903" y="499.5791">ja</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.2266" x="137.6045" y="468.3198">Anweisungstaste gedr&#252;ckt, oder</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.9717" x="137.6045" y="484.4185">&#8222;Nachbearbeitung&#8220; auf &#8222;Immer&#8220;?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="349.5762" y="468.5317">nein</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="175.7168" x="149.7319" y="815.2217"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.7168" x="161.7319" y="840.3535">Gespeichert im &#8222;Verlauf&#8220;</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="187.4063" x="214.3757" y="905.2178"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.9375" x="226.3757" y="930.3496">Der Text wartet, bis ein</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.4063" x="226.3757" y="946.4482">macOS-Dienst ihn einf&#252;gt,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.248" x="226.3757" y="962.5469">z. B. mit &#8222;Letzte</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.1855" x="226.3757" y="978.6455">Transkription einf&#252;gen&#8220;</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="199.0889" x="208.5344" y="1043.5098"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.7715" x="220.5344" y="1068.6416">In der Zwischenablage oder</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.3926" x="220.5344" y="1084.7402">nur im &#8222;Verlauf&#8220;, je nach</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.0889" x="220.5344" y="1100.8389">&#8222;Zwischenablage-Verhalten&#8220;</text><polygon fill="#182327" points="79.5574,875.3203,186.5344,875.3203,198.5344,890.269,186.5344,905.2178,79.5574,905.2178,67.5574,890.269,79.5574,875.3203" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.4917" x="79.5574" y="887.5142">Ein Mac ohne</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.9771" x="79.5574" y="902.4629">Bedienungshilfen?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="198.5344" y="887.5142">ja</text><polygon fill="#182327" points="79.5701,1013.6123,186.5217,1013.6123,198.5217,1028.561,186.5217,1043.5098,79.5701,1043.5098,67.5701,1028.561,79.5701,1013.6123" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.9517" x="79.5701" y="1025.8062">&#8222;Einf&#252;gemethode&#8220;:</text><te