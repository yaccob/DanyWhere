<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1098px" preserveAspectRatio="none" style="width:993px;height:1098px;" version="1.1" viewBox="0 0 993 1098" width="993px" zoomAndPan="magnify"><defs/><g><ellipse cx="501.4304" cy="26" fill="#CFE9ED" rx="10" ry="10" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M185.0979,56 L185.0979,125.7949 L416.3894,125.7949 L416.3894,66 L406.3894,56 L185.0979,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M406.3894,56 L406.3894,66 L416.3894,66 L406.3894,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.2998" x="191.0979" y="73.1938">&#8222;Letzte Transkription kopieren&#8220;</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.2915" x="191.0979" y="88.1426">beendet sie auch, wie ihre Starttaste</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.2134" x="191.0979" y="103.0913">es t&#228;te, und legt den Text statt-</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.167" x="191.0979" y="118.04">dessen in die Zwischenablage</text><path d="M586.4714,56 L586.4714,125.7949 L804.7566,125.7949 L804.7566,66 L794.7566,56 L586.4714,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M794.7566,56 L794.7566,66 L804.7566,66 L794.7566,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3188" x="592.4714" y="73.1938">Unter Linux gilt die eigene</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2852" x="592.4714" y="88.1426">Tastenkombination einer Endtaste</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.7134" x="592.4714" y="103.0913">nicht, es gibt keine Anweisungs-</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.1543" x="592.4714" y="118.04">tasten, und Esc bricht nicht ab</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="150.082" x="426.3894" y="70.8481"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.082" x="438.3894" y="95.98">Eine Aufnahme l&#228;uft</text><polygon fill="#182327" points="445.3962,155.7949,557.4646,155.7949,569.4646,167.7949,557.4646,179.7949,445.3962,179.7949,433.3962,167.7949,445.3962,155.7949" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="445.3962" y="172.8774">Was beendet sie?</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="96.3926" x="17" y="266.8447"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.793" x="29" y="291.9766">Diese</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.2617" x="29" y="308.0752">Endtaste</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.3926" x="29" y="324.1738">beendet sie</text><rect fill="#1D3A40" height="136.6904" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="108.041" x="158.3125" y="296.7422"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.1582" x="170.3125" y="321.874">Die Endtaste</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.041" x="170.3125" y="337.9727">mit derselben</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.4619" x="170.3125" y="354.0713">Tasten-</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.4893" x="170.3125" y="370.1699">kombination</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.2822" x="170.3125" y="386.2686">beendet sie,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.9307" x="170.3125" y="402.3672">falls es eine</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.5723" x="170.3125" y="418.4658">gibt</text><path d="M416.9302,283.6189 L416.9302,321.9907 L396.9302,325.9907 L416.9302,329.9907 L416.9302,368.3625 A0,0 0 0 0 416.9302,368.3625 L556.4409,368.3625 A0,0 0 0 0 556.4409,368.3625 L556.4409,293.6189 L546.4409,283.6189 L416.9302,283.6189 A0,0 0 0 0 416.9302,283.6189" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M546.4409,283.6189 L546.4409,293.6189 L556.4409,293.6189 L546.4409,283.6189" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.7554" x="422.9302" y="300.8127">Gleich wieder</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.7681" x="422.9302" y="315.7615">losgelassen, verwirft</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.2935" x="422.9302" y="330.7102">eine Haltetaste, die</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.5107" x="422.9302" y="345.6589">nicht auch Starttaste</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4453" x="422.9302" y="360.6077">ist, die Aufnahme</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="100.2891" x="296.6411" y="281.7935"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.2344" x="308.6411" y="306.9253">Die Werte</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.1309" x="308.6411" y="323.0239">dieser</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.0342" x="308.6411" y="339.1226">Haltetaste</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.2891" x="308.6411" y="355.2212">beenden sie</text><rect fill="#1D3A40" height="104.4932" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="143.8408" x="631.4233" y="266.8447"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="81.7031" x="643.4233" y="291.9766">&#8222;Anweisung&#8220;:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.2686" x="643.4233" y="308.0752">Was du jetzt sagst,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.8408" x="643.4233" y="324.1738">sagt der Nachbear-</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.3926" x="643.4233" y="340.2725">beitung, was sie</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.3584" x="643.4233" y="356.3711">tun soll</text><polygon fill="#182327" points="656.6372,406.3379,750.0503,406.3379,762.0503,422.4365,750.0503,438.5352,656.6372,438.5352,644.6372,422.4365,656.6372,406.3379" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.1582" x="656.6372" y="419.4697">Angetippt</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.4131" x="656.6372" y="435.5684">oder gehalten?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.4917" x="591.1455" y="419.6816">angetippt</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.8799" x="762.0503" y="419.6816">gehalten</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="96.3926" x="586.4409" y="448.5352"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="28.0205" x="598.4409" y="473.667">Eine</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.2617" x="598.4409" y="489.7656">Endtaste</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.3926" x="598.4409" y="505.8643">beendet sie</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="118.9443" x="712.5781" y="448.5352"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.8271" x="724.5781" y="473.667">Das Loslassen</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9443" x="724.5781" y="489.7656">beendet sie mit</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.8477" x="724.5781" y="505.8643">ihren eigenen</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="45.124" x="724.5781" y="521.9629">Werten</text><rect fill="#3D2224" height="88.3945" rx="10" ry="10" style="stroke:#F87171;stroke-width:1.25;" width="111.1787" x="841.5225" y="281.7935"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.1787" x="853.5225" y="306.9253">Abgebrochen:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1309" x="853.5225" y="323.0239">nichts wird</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.1309" x="853.5225" y="339.1226">transkribiert</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.627" x="853.5225" y="355.2212">oder behalten</text><ellipse cx="897.1118" cy="416.188" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="897.1118" cy="416.188" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><polygon fill="#182327" points="501.4304,564.9297,501.4304,564.9297,513.4304,576.9297,501.4304,588.9297,501.4304,588.9297,489.4304,576.9297,501.4304,564.9297" style="stroke:#5BB3C0;stroke-width:1.25;"/><polygon fill="#182327" points="417.7722,608.9297,585.0886,608.9297,597.0886,633.0776,585.0886,657.2256,417.7722,657.2256,405.7722,633.0776,417.7722,608.9297" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.3164" x="417.7722" y="622.0615">Anweisungstaste gedr&#252;ckt,</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.8682" x="417.7722" y="638.1602">oder &#8222;Nachbearbeitung&#8220;</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.124" x="417.7722" y="654.2588">auf &#8222;Immer&#8220;?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="395.6541" y="630.3228">ja</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="597.0886" y="630.3228">nein</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="236.4678" x="268.29" y="667.2256"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.999" x="280.29" y="692.3574">Nachbearbeitet mit den aktiven</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.7441" x="280.29" y="708.4561">Prompts des Profils und der</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.4678" x="280.29" y="724.5547">gesprochenen Anweisung, falls es</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.9307" x="280.29" y="740.6533">eine gibt</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="219.3232" x="276.8623" y="833.2917"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.3232" x="288.8623" y="858.4236">Fr&#252;here Diktate aus demselben</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.9854" x="288.8623" y="874.5222">Fenster gehen als Kontext mit</text><polygon fill="#182327" points="330.4863,775.6201,442.5615,775.6201,454.5615,791.7188,442.5615,807.8174,330.4863,807