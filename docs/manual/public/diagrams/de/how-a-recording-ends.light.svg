<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="931px" preserveAspectRatio="none" style="width:708px;height:931px;" version="1.1" viewBox="0 0 708 931" width="708px" zoomAndPan="magnify"><defs/><g><ellipse cx="353.8347" cy="26" fill="#1E3A44" rx="10" ry="10" style="stroke:#1E3A44;stroke-width:1;"/><path d="M37.5022,56 L37.5022,125.7949 L268.7937,125.7949 L268.7937,66 L258.7937,56 L37.5022,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M258.7937,56 L258.7937,66 L268.7937,66 L258.7937,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.2998" x="43.5022" y="73.1938">&#8222;Letzte Transkription kopieren&#8220;</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.2915" x="43.5022" y="88.1426">beendet sie auch, wie ihre Starttaste</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.2134" x="43.5022" y="103.0913">es t&#228;te, und legt den Text statt-</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.167" x="43.5022" y="118.04">dessen in die Zwischenablage</text><path d="M438.8757,63.4744 L438.8757,118.3206 L657.1609,118.3206 L657.1609,73.4744 L647.1609,63.4744 L438.8757,63.4744" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M647.1609,63.4744 L647.1609,73.4744 L657.1609,73.4744 L647.1609,63.4744" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3188" x="444.8757" y="80.6682">Unter Linux gilt die eigene</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2852" x="444.8757" y="95.6169">Tastenkombination einer Endtaste</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.2007" x="444.8757" y="110.5657">nicht, und Esc bricht nicht ab</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="150.082" x="278.7937" y="70.8481"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.082" x="290.7937" y="95.98">Eine Aufnahme l&#228;uft</text><polygon fill="#FFFFFF" points="297.8005,155.7949,409.8689,155.7949,421.8689,167.7949,409.8689,179.7949,297.8005,179.7949,285.8005,167.7949,297.8005,155.7949" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="297.8005" y="172.8774">Was beendet sie?</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="118.9443" x="17" y="259.3704"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9443" x="29" y="284.5022">Diese Endtaste</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.3926" x="29" y="300.6008">beendet sie</text><rect fill="#E7F3F5" height="88.3945" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="153.9854" x="179.5884" y="259.3704"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.71" x="191.5884" y="284.5022">Die Endtaste mit</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.8408" x="191.5884" y="300.6008">derselben Tasten-</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.9854" x="191.5884" y="316.6995">kombination beendet</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.0684" x="191.5884" y="332.7981">sie, falls es eine gibt</text><rect fill="#E7F3F5" height="104.4932" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="160.9717" x="370.5454" y="274.3191"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="382.5454" y="299.4509">Ihr Ende &#8222;Beim</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.3027" x="382.5454" y="315.5496">Halten&#8220; beendet sie,</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.165" x="382.5454" y="331.6482">bei &#8222;Halten&#8220;, oder</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.9307" x="382.5454" y="347.7468">bei &#8222;Automatisch&#8220;</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="382.5454" y="363.8455">nach l&#228;ngerem Halten</text><rect fill="#FDECEC" height="88.3945" rx="10" ry="10" style="stroke:#DC2626;stroke-width:1.25;" width="111.1787" x="556.3311" y="274.3191"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.1787" x="568.3311" y="299.4509">Abgebrochen:</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1309" x="568.3311" y="315.5496">nichts wird</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.1309" x="568.3311" y="331.6482">transkribiert</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.627" x="568.3311" y="347.7468">oder behalten</text><ellipse cx="611.9204" cy="408.7136" fill="none" rx="11" ry="11" style="stroke:#1E3A44;stroke-width:1;"/><ellipse cx="611.9204" cy="408.7136" fill="#1E3A44" rx="6" ry="6" style="stroke:#1E3A44;stroke-width:1;"/><polygon fill="#FFFFFF" points="353.8347,429.7136,353.8347,429.7136,365.8347,441.7136,353.8347,453.7136,353.8347,453.7136,341.8347,441.7136,353.8347,429.7136" style="stroke:#3C9CAA;stroke-width:1.25;"/><polygon fill="#FFFFFF" points="245.6594,473.7136,462.01,473.7136,474.01,497.8616,462.01,522.0095,245.6594,522.0095,233.6594,497.8616,245.6594,473.7136" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="216.3506" x="245.6594" y="486.8455">&#8222;Nachbearbeiten&#8220; bei diesem Ende</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.2061" x="245.6594" y="502.9441">und &#8222;Nachbearbeitung&#8220;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.917" x="245.6594" y="519.0427">im Profil ein?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="223.5413" y="495.1067">ja</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="474.01" y="495.1067">nein</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="193.6201" x="126.8494" y="532.0095"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.751" x="138.8494" y="557.1414">Nachbearbeitet mit den</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.6201" x="138.8494" y="573.24">aktiven Prompts des Profils</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="219.3232" x="113.9978" y="665.8784"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.3232" x="125.9978" y="691.0103">Fr&#252;here Diktate aus demselben</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.9854" x="125.9978" y="707.1089">Fenster gehen als Kontext mit</text><polygon fill="#FFFFFF" points="167.6218,608.2068,279.697,608.2068,291.697,624.3054,279.697,640.4041,167.6218,640.4041,155.6218,624.3054,167.6218,608.2068" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="227.6594" y="652.5979">ja</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.6201" x="167.6218" y="621.3386">&#8222;Kontext senden&#8220;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.0752" x="167.6218" y="637.4373">bei diesem Ende?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="291.697" y="621.5505">nein</text><rect fill="#F3F5F5" height="56.1973" rx="10" ry="10" style="stroke:#A9BABE;stroke-width:1.25;" width="156.3027" x="405.8586" y="532.0095"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.3027" x="417.8586" y="557.1414">Nicht nachbearbeitet,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.0479" x="417.8586" y="573.24">kein Kontext</text><rect fill="#E7F3F5" height="88.3945" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="248.1094" x="229.78" y="784.0757"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.1094" x="241.78" y="809.2075">&#8222;Anh&#228;ngen&#8220;: Sein Text kommt dazu,</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="193.7783" x="241.78" y="825.3062">dann sein Tastendruck, der nur</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.6543" x="241.78" y="841.4048">gesendet wird, wenn der Text</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.165" x="241.78" y="857.5034">eingef&#252;gt wird</text><ellipse cx="353.8347" cy="903.4702" fill="none" rx="11" ry="11" style="stroke:#1E3A44;stroke-width:1;"/><ellipse cx="353.8347" cy="903.4702" fill="#1E3A44" rx="6" ry="6" style="stroke:#1E3A44;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="353.8347" x2="353.8347" y1="36" y2="70.8481"/><polygon fill="#3C9CAA" points="349.8347,60.8481,353.8347,70.8481,357.8347,60.8481,353.8347,64.8481" style="stroke:#3C9CAA;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="611.9204" x2="611.9204" y1="362.7136" y2="397.7136"/><polygon fill="#3C9CAA" points="607.9204,387.7136,611.9204,397.7136,615.9204,387.7136,611.9204,391.7136" style="stroke:#3C9CAA;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="285.8005" x2="76.4722" y1="167.7949" y2="167.7949"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="76.4722" x2="76.4722" y1="167.7949" y2="259.3704"/><polygon fill="#3C9CAA" points="72.4722,249.3704,76.4722,259.3704,80.4722,249.3704,76.4722,253.3704" style="stroke:#3C9CAA;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.1162" x="76.4722" y="208.2437">eine Endtaste,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.4917" x="76.4722" y="223.1924">angetippt</text><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="421.8689" x2="611.9204" y1="167.7949" y2="167.7949"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="611.9204" x2="611.9204" y1="167.7949" y2="274.3191"/><polygon fill="#3C9CAA" points="607.9204,264.3191,611.9204,274.3191,615.9204,264.3191,611.9204,268.3191" style="stroke:#3C9CAA;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', s