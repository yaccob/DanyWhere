<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="931px" preserveAspectRatio="none" style="width:683px;height:931px;" version="1.1" viewBox="0 0 683 931" width="683px" zoomAndPan="magnify"><defs/><g><ellipse cx="342.3325" cy="26" fill="#1E3A44" rx="10" ry="10" style="stroke:#1E3A44;stroke-width:1;"/><path d="M26,56 L26,125.7949 L257.2915,125.7949 L257.2915,66 L247.2915,56 L26,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M247.2915,56 L247.2915,66 L257.2915,66 L247.2915,56" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.2998" x="32" y="73.1938">&#8222;Letzte Transkription kopieren&#8220;</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.2915" x="32" y="88.1426">beendet sie auch, wie ihre Starttaste</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.2134" x="32" y="103.0913">es t&#228;te, und legt den Text statt-</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.167" x="32" y="118.04">dessen in die Zwischenablage</text><path d="M427.3735,63.4744 L427.3735,118.3206 L645.6587,118.3206 L645.6587,73.4744 L635.6587,63.4744 L427.3735,63.4744" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M635.6587,63.4744 L635.6587,73.4744 L645.6587,73.4744 L635.6587,63.4744" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3188" x="433.3735" y="80.6682">Unter Linux gilt die eigene</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2852" x="433.3735" y="95.6169">Tastenkombination einer Endtaste</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.2007" x="433.3735" y="110.5657">nicht, und Esc bricht nicht ab</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="150.082" x="267.2915" y="70.8481"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.082" x="279.2915" y="95.98">Eine Aufnahme l&#228;uft</text><polygon fill="#FFFFFF" points="286.2983,155.7949,398.3667,155.7949,410.3667,167.7949,398.3667,179.7949,286.2983,179.7949,274.2983,167.7949,286.2983,155.7949" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="286.2983" y="172.8774">Was beendet sie?</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="118.9443" x="19.1353" y="259.3704"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9443" x="31.1353" y="284.5022">Diese Endtaste</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.3926" x="31.1353" y="300.6008">beendet sie</text><rect fill="#E7F3F5" height="88.3945" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="153.9854" x="158.0796" y="259.3704"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.71" x="170.0796" y="284.5022">Die Endtaste mit</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.8408" x="170.0796" y="300.6008">derselben Tasten-</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.9854" x="170.0796" y="316.6995">kombination beendet</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.0684" x="170.0796" y="332.7981">sie, falls es eine gibt</text><rect fill="#E7F3F5" height="104.4932" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="160.9717" x="345.4058" y="274.3191"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="357.4058" y="299.4509">Ihr Ende &#8222;Beim</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.3027" x="357.4058" y="315.5496">Halten&#8220; beendet sie,</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.165" x="357.4058" y="331.6482">bei &#8222;Halten&#8220;, oder</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.9307" x="357.4058" y="347.7468">bei &#8222;Automatisch&#8220;</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.9717" x="357.4058" y="363.8455">nach l&#228;ngerem Halten</text><rect fill="#FDECEC" height="88.3945" rx="10" ry="10" style="stroke:#DC2626;stroke-width:1.25;" width="111.1787" x="531.1914" y="274.3191"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.1787" x="543.1914" y="299.4509">Abgebrochen:</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1309" x="543.1914" y="315.5496">nichts wird</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.1309" x="543.1914" y="331.6482">transkribiert</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.627" x="543.1914" y="347.7468">oder behalten</text><ellipse cx="586.7808" cy="408.7136" fill="none" rx="11" ry="11" style="stroke:#1E3A44;stroke-width:1;"/><ellipse cx="586.7808" cy="408.7136" fill="#1E3A44" rx="6" ry="6" style="stroke:#1E3A44;stroke-width:1;"/><polygon fill="#FFFFFF" points="342.3325,429.7136,342.3325,429.7136,354.3325,441.7136,342.3325,453.7136,342.3325,453.7136,330.3325,441.7136,342.3325,429.7136" style="stroke:#3C9CAA;stroke-width:1.25;"/><polygon fill="#FFFFFF" points="234.1572,473.7136,450.5078,473.7136,462.5078,497.8616,450.5078,522.0095,234.1572,522.0095,222.1572,497.8616,234.1572,473.7136" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="216.3506" x="234.1572" y="486.8455">&#8222;Nachbearbeiten&#8220; bei diesem Ende</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.2061" x="234.1572" y="502.9441">und &#8222;Nachbearbeitung&#8220;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.917" x="234.1572" y="519.0427">im Profil ein?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="212.0391" y="495.1067">ja</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="462.5078" y="495.1067">nein</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="193.6201" x="115.3472" y="532.0095"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.751" x="127.3472" y="557.1414">Nachbearbeitet mit den</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.6201" x="127.3472" y="573.24">aktiven Prompts des Profils</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="219.3232" x="102.4956" y="665.8784"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.3232" x="114.4956" y="691.0103">Fr&#252;here Diktate aus demselben</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.9854" x="114.4956" y="707.1089">Fenster gehen als Kontext mit</text><polygon fill="#FFFFFF" points="156.1196,608.2068,268.1948,608.2068,280.1948,624.3054,268.1948,640.4041,156.1196,640.4041,144.1196,624.3054,156.1196,608.2068" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1182" x="216.1572" y="652.5979">ja</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.6201" x="156.1196" y="621.3386">&#8222;Kontext senden&#8220;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.0752" x="156.1196" y="637.4373">bei diesem Ende?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="280.1948" y="621.5505">nein</text><rect fill="#F3F5F5" height="56.1973" rx="10" ry="10" style="stroke:#A9BABE;stroke-width:1.25;" width="156.3027" x="394.3564" y="532.0095"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.3027" x="406.3564" y="557.1414">Nicht nachbearbeitet,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.0479" x="406.3564" y="573.24">kein Kontext</text><rect fill="#E7F3F5" height="88.3945" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="248.1094" x="218.2778" y="784.0757"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.1094" x="230.2778" y="809.2075">&#8222;Anh&#228;ngen&#8220;: Sein Text kommt dazu,</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="193.7783" x="230.2778" y="825.3062">dann sein Tastendruck, der nur</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.6543" x="230.2778" y="841.4048">gesendet wird, wenn der Text</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.165" x="230.2778" y="857.5034">eingef&#252;gt wird</text><ellipse cx="342.3325" cy="903.4702" fill="none" rx="11" ry="11" style="stroke:#1E3A44;stroke-width:1;"/><ellipse cx="342.3325" cy="903.4702" fill="#1E3A44" rx="6" ry="6" style="stroke:#1E3A44;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="342.3325" x2="342.3325" y1="36" y2="70.8481"/><polygon fill="#3C9CAA" points="338.3325,60.8481,342.3325,70.8481,346.3325,60.8481,342.3325,64.8481" style="stroke:#3C9CAA;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="586.7808" x2="586.7808" y1="362.7136" y2="397.7136"/><polygon fill="#3C9CAA" points="582.7808,387.7136,586.7808,397.7136,590.7808,387.7136,586.7808,391.7136" style="stroke:#3C9CAA;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="274.2983" x2="78.6074" y1="167.7949" y2="167.7949"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="78.6074" x2="78.6074" y1="167.7949" y2="259.3704"/><polygon fill="#3C9CAA" points="74.6074,249.3704,78.6074,259.3704,82.6074,249.3704,78.6074,253.3704" style="stroke:#3C9CAA;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="78.6074" y="208.2437">eine</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.3145" x="78.6074" y="223.1924">Endtaste</text><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="410.3667" x2="586.7808" y1="167.7949" y2="167.7949"/><line style="stroke:#3C9CAA;stroke-width:1.25;" x1="586.7808" x2="586.7808" y1="167.7949" y2="274.3191"/><polygon fill="#3C9CAA" points="582.7808,264.3191,586.7808,274.3191,590.7808,264.3191,586.7808,268.3191" style="stroke:#3C9CAA;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif