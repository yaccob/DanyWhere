C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.7935" x="391.4797" y="232.5884">Text und Anweisung</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="219.3164" x="146.1633" y="192.2959"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.3164" x="158.1633" y="217.4277">Eine Anweisungstaste, z. B. &#8677;:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.8613" x="158.1633" y="233.5264">das Overlay zeigt &#8222;Anweisung&#8220;</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="479.6431" x="17" y="268.4932"/><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="167.1924" x="29" y="378.2397"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.3857" x="41" y="403.3716">Das Sprachmodell</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.3857" x="41" y="419.4702">transkribiert den Text,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.1924" x="41" y="435.5688">dann zeigt das Overlay</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.8271" x="41" y="451.6675">ein H&#228;kchen</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="128.2754" x="281.8853" y="294.4932"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.5928" x="293.8853" y="319.625">Du sprichst die</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.2754" x="293.8853" y="335.7236">Anweisung, z. B.</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.6064" x="293.8853" y="351.8223">&#8222;&#252;bersetze das</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.1514" x="293.8853" y="367.9209">ins Polnische&#8220;</text><polygon fill="#182327" points="299.3164,417.8877,392.7295,417.8877,404.7295,433.9863,392.7295,450.085,299.3164,450.085,287.3164,433.9863,299.3164,417.8877" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.1582" x="299.3164" y="431.0195">Angetippt</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.4131" x="299.3164" y="447.1182">oder gehalten?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.4917" x="233.8247" y="431.2314">angetippt</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.8799" x="404.7295" y="431.2314">gehalten</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="86.248" x="234.1924" y="460.085"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="28.0205" x="246.1924" y="485.2168">Eine</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.2617" x="246.1924" y="501.3154">Endtaste</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.248" x="246.1924" y="517.4141">schickt ab</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="115.8271" x="356.8159" y="460.085"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.8271" x="368.8159" y="485.2168">Das Loslassen</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.248" x="368.8159" y="501.3154">schickt ab</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="479.6431" x="17" y="570.3809"/><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="310.3574" x="100.6428" y="596.3809"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="286.3574" x="112.6428" y="621.5127">Das Sprachmodell transkribiert die Anweisung</text><path d="M406.5002,657.155 L406.5002,680.5781 L386.5002,684.5781 L406.5002,688.5781 L406.5002,712.0012 A0,0 0 0 0 406.5002,712.0012 L600.2009,712.0012 A0,0 0 0 0 600.2009,712.0012 L600.2009,667.155 L590.2009,657.155 L406.5002,657.155 A0,0 0 0 0 406.5002,657.155" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M590.2009,657.155 L590.2009,667.155 L600.2009,667.155 L590.2009,657.155" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.7007" x="412.5002" y="674.3489">Nach der Taste nichts gesagt:</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.7344" x="412.5002" y="689.2976">nur die Prompts. Vor ihr kein</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.0762" x="412.5002" y="704.2463">Text: nur die Anweisung.</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="261.3574" x="125.1428" y="656.4795"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="237.3574" x="137.1428" y="681.6113">Nachbearbeitung: die aktiven Prompts</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="137.1428" y="697.71">des Profils, dann die Anweisung</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="291.668" x="109.9875" y="732.6768"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.4883" x="121.9875" y="757.8086">&#8222;Anh&#228;ngen&#8220; des Endes, eingef&#252;gt,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="267.668" x="121.9875" y="773.9072">im &#8222;Verlauf&#8220; mit der Anweisung gespeichert</text><ellipse cx="255.8215" cy="819.874" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="255.8215" cy="819.874" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><line style="st