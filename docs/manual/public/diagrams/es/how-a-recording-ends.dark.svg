y="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.6064" x="801.1899" y="323.0239">no se transcribe</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.0889" x="801.1899" y="339.1226">ni se guarda nada</text><ellipse cx="857.2344" cy="400.0894" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="857.2344" cy="400.0894" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><polygon fill="#182327" points="466.1394,564.9297,466.1394,564.9297,478.1394,576.9297,466.1394,588.9297,466.1394,588.9297,454.1394,576.9297,466.1394,564.9297" style="stroke:#5BB3C0;stroke-width:1.25;"/><polygon fill="#182327" points="360.6882,608.9297,571.5906,608.9297,583.5906,633.0776,571.5906,657.2256,360.6882,657.2256,348.6882,633.0776,360.6882,608.9297" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="210.9023" x="360.6882" y="622.0615">&#191;Se puls&#243; un atajo de instrucci&#243;n,</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.9785" x="360.6882" y="638.1602">o &#171;Post procesamiento&#187;</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.3027" x="360.6882" y="654.2588">est&#225; en &#171;Siempre&#187;?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="338.5764" y="630.3228">s&#237;</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="58