4" lengthAdjust="spacing" textLength="148.6475" x="143.9978" y="85.98">Pulsar un atajo de inicio</text><path d="M353.052,151.9941 L353.052,167.9429 L333.052,171.9429 L353.052,175.9429 L353.052,191.8916 A0,0 0 0 0 353.052,191.8916 L608.9026,191.8916 A0,0 0 0 0 608.9026,191.8916 L608.9026,161.9941 L598.9026,151.9941 L353.052,151.9941 A0,0 0 0 0 353.052,151.9941" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M598.9026,151.9941 L598.9026,161.9941 L608.9026,161.9941 L598.9026,151.9941" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.7915" x="359.052" y="169.188">C&#243;mo puede terminar y qu&#233; decide el</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.8506" x="359.052" y="184.1367">final: ver &#171;C&#243;mo termina una grabaci&#243;n&#187;</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="229.4609" x="103.5911" y="135.7949"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.7783" x="115.5911" y="160.9268">La grabaci&#243;n est&#225; en curso:</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="205.4609" x="115.5911" y="177.0254">sonido de inicio, la superposici&#243;n</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.041" x="115.5911" y="193.124">muestra el nivel</text><polygon fill="#FFFFFF" points="166.1941,252.1919,270.449,252.1919,282.449,264.1919,270.449,276.1919,166.1941,276.1919,154.1941,264.1919,166.1941,252.1919" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.2549" x="166.1941" y="269.2744">&#191;C&#243;mo termina?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2871" x="41.447" y="231.5396">un atajo de fin,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.7471" x="41.447" y="246.4883">o se suelta un atajo</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.0171" x="41.447" y="261.437">de inicio mantenido</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.9116" x="282.449" y="246.4883">&#171;Atajo de cancelar&#187;</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="30.3291" x="282.449" y="261.437">(Esc)</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="177.3369" x="42.0776" y="286.1919"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.3369" x="54.0776" y="311.3237">La grabaci&#243;n se detiene:</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.1992" x="54.0776" y="327.4224">sonido de parada</text><rect fill="#FDECEC" height="72.2959" rx="10" ry="10" style="stroke:#DC2626;stroke-width:1.25;" width="132.9648" x="239.4146" y="286.1919"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.9648" x="251.4146" y="311.3237">Cancelada: no se</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9307" x="251.4146" y="327.4224">transcribe ni se</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.627" x="251.4146" y="343.521">guarda nada</text><ellipse cx="305.897" cy="389.4878" fill="none" rx="11" ry="11" style="stroke:#1E3A44;stroke-width:1;"/><ellipse cx="305.897" cy="389.4878" fill="#1E3A44" rx="6" ry="6" style="stroke:#1E3A44;stroke-width:1;"/><path d="M336.697,420.5884 L336.697,436.5371 L316.697,440.5371 L336.697,444.5371 L336.697,460.4858 A0,0 0 0 0 336.697,460.4858 L576.6721,460.4858 A0,0 0 0 0 576.6721,460.4858 L576.6721,430.5884 L566.6721,420.5884 L336.697,420.5884 A0,0 0 0 0 336.697,420.5884" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M566.6721,420.5884 L566.6721,430.5884 L576.6721,430.5884 L566.6721,420.5884" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.9751" x="342.697" y="437.7822">Listas de palabras: un modelo que las</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6479" x="342.697" y="452.731">admite, como Whisper, las usa aqu&#237;</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="196.751" x="119.946" y="420.4878"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.751" x="131.946" y="445.6196">El modelo de voz transcribe</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="202.999" x="116.822" y="595.9297"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.999" x="128.822" y="621.0615">Los dictados anteriores de la</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.5303" x="128.822" y="637.1602">misma ventana se env&#237;an</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.0479" x="128.822" y="653.2588">como contexto</text><polygon fill="#FFFFFF" points="158.0115,538.2581,278.6316,538.2581,290.6316,554.3567,278.6316,570.4553,158.0115,570.4553,146.0115,554.3567,158.0115,538.2581" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="222.3215" y="582.6492">s&#237;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.6201" x="158.0115" y="551.3899">&#191;&#171;Enviar contexto&#187;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.2822" x="158.0115" y="567.4885">en este final?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="290.6316" y="551.6018">no</text><path d="M356.552,734.4741 L356.552,750.4229 L336.552,754.4229 L356.552,758.4229 L356.552,774.3716 A0,0 0 0 0 356.552,774.3716 L559.6599,774.3716 A0,0 0 0 0 559.6599,774.3716 L559.6599,744.4741 L549.6599,734.4741 L356.552,734.4741 A0,0 0 0 0 356.552,734.4741" fill="#F3F5F5" style="s