37;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.9717" x="116.76" y="493.7183">&#191;El final posprocesa, y est&#225;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.123" x="116.76" y="509.8169">activado &#171;Post procesamiento&#187;?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="331.8831" y="493.9302">no</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="192.8818" x="121.8806" y="840.6201"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.8818" x="133.8806" y="865.752">Se guarda en el &#171;Historial&#187;</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="216.2061" x="194.437" y="930.6162"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.5508" x="206.437" y="955.748">Espera hasta que un servicio</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.4268" x="206.437" y="971.8467">de macOS lo inserte, p. ej. con</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.2061" x="206.437" y="987.9453">&#171;Pegar la &#250;ltima transcripci&#243;n&#187;</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="192.9023" x="206.0889" y="1052.8096"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberati