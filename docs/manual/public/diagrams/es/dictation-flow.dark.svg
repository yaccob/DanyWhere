<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1600px" preserveAspectRatio="none" style="width:652px;height:1600px;" version="1.1" viewBox="0 0 652 1600" width="652px" zoomAndPan="magnify"><defs/><g><ellipse cx="218.3215" cy="26" fill="#CFE9ED" rx="10" ry="10" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M371.7312,46 L371.7312,76.8975 L351.7312,80.8975 L371.7312,84.8975 L371.7312,115.7949 A0,0 0 0 0 371.7312,115.7949 L634.0945,115.7949 A0,0 0 0 0 634.0945,115.7949 L634.0945,56 L624.0945,46 L371.7312,46 A0,0 0 0 0 371.7312,46" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M624.0945,46 L624.0945,56 L634.0945,56 L624.0945,46" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.2852" x="377.7312" y="63.1938">El perfil: lo decide la aplicaci&#243;n en primer</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3633" x="377.7312" y="78.1426">plano (&#171;Elegir perfil seg&#250;n la aplicaci&#243;n&#187;),</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.7241" x="377.7312" y="93.0913">si no, el de &#171;En uso&#187;. Se elige de nuevo</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.458" x="377.7312" y="108.04">al terminar la grabaci&#243;n.</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="266.8193" x="84.9119" y="60.8481"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="242.8193" x="96.9119" y="85.98">Pulsar un atajo de inicio o de mantener</text><path d="M353.052,144.5198 L353.052,167.9429 L333.052,171.9429 L353.052,175.9429 L353.052,199.366 A0,0 0 0 0 353.052,199.366 L584.3435,199.366 A0,0 0 0 0 584.3435,199.366 L584.3435,154.5198 L574.3435,144.5198 L353.052,144.5198 A0,0 0 0 0 353.052,144.5198" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M574.3435,144.5198 L574.3435,154.5198 L584.3435,154.5198 L574.3435,144.5198" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.2915" x="359.052" y="161.7136">C&#243;mo puede terminar, qu&#233; decide el</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.6016" x="359.052" y="176.6624">final y la instrucci&#243;n hablada: ver</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.1079" x="359.052" y="191.6111">&#171;C&#243;mo termina una grabaci&#243;n&#187;</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="229.4609" x="103.5911" y="135.7949"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.7783" x="115.5911" y="160.9268">La grabaci&#243;n est&#225; en curso:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="205.4609" x="115.5911" y="177.0254">sonido de inicio, la superposici&#243;n</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.041" x="115.5911" y="193.124">muestra el nivel</text><polygon fill="#182327" points="166.1941,252.1919,270.449,252.1919,282.449,264.1919,270.449,276.1919,166.1941,276.1919,154.1941,264.1919,166.1941,252.1919" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.2549" x="166.1941" y="269.2744">&#191;C&#243;mo termina?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2871" x="41.447" y="231.5396">un atajo de fin,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.7471" x="41.447" y="246.4883">o se suelta un atajo</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.9917" x="41.447" y="261.437">de mantener</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.9116" x="282.449" y="246.4883">&#171;Atajo de cancelar&#187;</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="30.3291" x="282.449" y="261.437">(Esc)</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="177.3369" x="42.0776" y="286.1919"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.3369" x="54.0776" y="311.3237">La grabaci&#243;n se detiene:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.1992" x="54.0776" y="327.4224">sonido de parada</text><rect fill="#3D2224" height="72.2959" rx="10" ry="10" style="stroke:#F87171;stroke-width:1.25;" width="132.9648" x="239.4146" y="286.1919"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.9648" x="251.4146" y="311.3237">Cancelada: no se</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9307" x="251.4146" y="327.4224">transcribe ni se</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.627" x="251.4146" y="343.521">guarda nada</text><ellipse cx="305.897" cy="389.4878" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="305.897" cy="389.4878" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M336.697,420.5884 L336.697,436.5371 L316.697,440.5371 L336.697,444.5371 L336.697,460.4858 A0,0 0 0 0 336.697,460.4858 L576.6721,460.4858 A0,0 0 0 0 576.6721,460.4858 L576.6721,430.5884 L566.6721,420.5884 L336.697,420.5884 A0,0 0 0 0 336.697,420.5884" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M566.6721,420.5884 L566.6721,430.5884 L576.6721,430.5884 L566.6721,420.5884" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.9751" x="342.697" y="437.7822">Listas de palabras: un modelo que las</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6479" x="342.697" y="452.731">admite, como Whisper, las usa aqu&#237;</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="196.751" x="119.946" y="420.4878"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.751" x="131.946" y="445.6196">El modelo de voz transcribe</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="202.999" x="116.822" y="612.0283"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.999" x="128.822" y="637.1602">Los dictados anteriores de la</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.5303" x="128.822" y="653.2588">misma ventana se env&#237;an</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.0479" x="128.822" y="669.3574">como contexto</text><polygon fill="#182327" points="158.0115,554.3567,278.6316,554.3567,290.6316,570.4553,278.6316,586.554,158.0115,586.554,146.0115,570.4553,158.0115,554.3567" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="222.3215" y="598.7478">s&#237;</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.6201" x="158.0115" y="567.4885">&#191;&#171;Enviar contexto&#187;</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.2822" x="158.0115" y="583.5872">en este final?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="290.6316" y="567.7004">no</text><path d="M355.7693,758.6221 L355.7693,774.5708 L335.7693,778.5708 L355.76