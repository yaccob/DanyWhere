.7373" x="112.8738" y="815.8506">como t&#233;rminos conocidos</text><polygon fill="#182327" points="112.8704,480.5864,323.7727,480.5864,335.7727,504.7344,323.7727,528.8823,112.8704,528.8823,100.8704,504.7344,112.8704,480.5864" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="222.3215" y="541.0762">s&#237;</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="210.9023" x="112.8704" y="493.7183">&#191;Se puls&#243; un atajo de instrucci&#243;n,</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.3301" x="112.8704" y="509.8169">o &#171;Post procesamiento&#187; est&#225;</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9512" x="112.8704" y="525.9155">en &#171;Siempre&#187;?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="335.7727" y="501.9795">no</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="192.8818" x="121.8806" y="872.8174"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.8818" x="133.8806" y="897.9492">Se guarda en el &#171;Historial&#187;</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="216.2061" x="194.437" y="962.8135"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.5508" x="206.437" y="987.9453">Espera hasta que un servicio</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.4268" x="206.437" y="1004.0439">de macOS lo inserte, p. ej. con</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.2061" x="206.437" y="1020.1426">&#171;Pegar la &#250;ltima transcripci&#243;n&#187;</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="192.9023" x="206.0889" y="1085.0068"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.8887" x="218.0889" y="1110.1387">En el portapapeles, o solo</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0957" x="218.0889" y="1126.2373">en el &#171;Historial&#187;, seg&#250;n el</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.9023" x="218.0889" y="1142.3359">&#171;Manejo del portapapeles&#187;</text><polygon fill="#182327" points="63.6667,932.916,146.7703,932.916,158.7703,947.8647,146.7703,962.8135,63.6667,962.8135,51.6667,947.8647,63.6667,932.916" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.96" x="63.6667" y="945.1099">&#191;Un Mac sin</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.1035" x="63.6667" y="960.0586">Accesibilidad?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" t