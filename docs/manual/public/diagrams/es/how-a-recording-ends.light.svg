texto&#187;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.2822" x="188.468" y="621.3386">en este final?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="321.0881" y="605.4519">no</text><rect fill="#F3F5F5" height="56.1973" rx="10" ry="10" style="stroke:#A9BABE;stroke-width:1.25;" width="129.0547" x="414.2429" y="515.9109"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.0547" x="426.2429" y="541.0427">Sin posprocesar,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.71" x="426.2429" y="557.1414">sin contexto</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="246.5918" x="240.4783" y="767.9771"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="222.5918" x="252.4783" y="793.1089">&#171;A&#241;adir al final&#187;: se a&#241;ade su texto,</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.8057" x="252.4783" y="809.2075">y luego su tecla, que solo se env&#237;a</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.668" x="252.4783" y="825.3062">cuando se pega el texto</text><ellipse cx="363.7742" cy="871.2729" fill="none" rx="11" ry="11" style="stroke:#1E3A44;stroke-width:1;"/><ellipse cx="363.7742" cy="871.2729" fill="#1E3A44" rx="6" ry="6" style="stroke:#1E3A44;stroke-width:1;"/><line style="stroke:#3C9CAA;stroke-width: