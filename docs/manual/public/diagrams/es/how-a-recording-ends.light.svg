ion Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.2959" x="169.5098" y="284.5022">El atajo de fin con</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.4961" x="169.5098" y="300.6008">la misma combinaci&#243;n</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.8203" x="169.5098" y="316.6995">la termina, si existe</text><rect fill="#E7F3F5" height="120.5918" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="143.8613" x="361.3994" y="274.3191"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.8203" x="373.3994" y="299.4509">Su final &#171;Al</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.8613" x="373.3994" y="315.5496">mantener pulsado&#187;</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.8203" x="373.3994" y="331.6482">la termina, con</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.7441" x="373.3994" y="347.7468">&#171;Mantener&#187;, o con</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.834" x="373.3994" y="363.8455">&#171;Autom&#225;tico&#187; tras</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.041" x="373.3994" y="379.9441">mantenerlo</text><rect fill="#FDECEC" height="72.2959" rx="10" ry="10" style="stroke:#DC