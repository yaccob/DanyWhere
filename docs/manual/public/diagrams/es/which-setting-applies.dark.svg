<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="718px" preserveAspectRatio="none" style="width:658px;height:718px;" version="1.1" viewBox="0 0 658 718" width="658px" zoomAndPan="magnify"><defs/><g><ellipse cx="246.6545" cy="26" fill="#CFE9ED" rx="10" ry="10" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M350.6404,46 L350.6404,84.3718 L330.6404,88.3718 L350.6404,92.3718 L350.6404,130.7437 A0,0 0 0 0 350.6404,130.7437 L540.7292,130.7437 A0,0 0 0 0 540.7292,130.7437 L540.7292,56 L530.7292,46 L350.6404,46 A0,0 0 0 0 350.6404,46" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M530.7292,46 L530.7292,56 L540.7292,56 L530.7292,46" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.2007" x="356.6404" y="63.1938">Ya al empezar se eligi&#243; un</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.3843" x="356.6404" y="78.1426">perfil, para que su modelo de</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.0889" x="356.6404" y="93.0913">voz pudiera cargarse. Decide</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.0488" x="356.6404" y="108.04">el final: el texto va adonde</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.0571" x="356.6404" y="122.9888">est&#233;s entonces.</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="167.9717" x="162.6687" y="68.3225"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.9717" x="174.6687" y="93.4543">Termina una grabaci&#243;n</text><polygon fill="#182327" points="164.9412,150.7437,328.3679,150.7437,340.3679,182.9409,328.3679,215.1382,164.9412,215.1382,152.9412,182.9409,164.9412,150.7437" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.1855" x="164.9412" y="163.8755">&#191;&#171;Elegir perfil seg&#250;n la</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6475" x="164.9412" y="179.9741">aplicaci&#243;n&#187; activado, y la</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="164.9412" y="196.0728">aplicaci&#243;n en primer plano</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.9854" x="164.9412" y="212.1714">asignada a un perfil?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="142.8293" y="180.186">s&#237;</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="340.3679" y="180.186">no</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="116.6064" x="84.6379" y="225.1382"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.6064" x="96.6379" y="250.27">El perfil de esa</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.2617" x="96.6379" y="266.3687">aplicaci&#243;n</text><path d="M471.4744,225.1382 L471.4744,256.0356 L451.4744,260.0356 L471.4744,264.0356 L471.4744,294.9331 A0,0 0 0 0 471.4744,294.9331 L640.6223,294.9331 A0,0 0 0 0 640.6223,294.9331 L640.6223,235.1382 L630.6223,225.1382 L471.4744,225.1382 A0,0 0 0 0 471.4744,225.1382" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M630.6223,225.1382 L630.6223,235.1382 L640.6223,235.1382 L630.6223,225.1382" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5234" x="477.4744" y="242.332">En Linux, DanyWhere no</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.4053" x="477.4744" y="257.2808">ve la aplicaci&#243;n en primer</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.958" x="477.4744" y="272.2295">plano: all&#237; vale siempre</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.1479" x="477.4744" y="287.1782">lo que muestra &#171;En uso&#187;.</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="202.2129" x="249.2615" y="231.937"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.2197" x="261.2615" y="257.0688">Lo que muestra &#171;En uso&#187;:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.2129" x="261.2615" y="273.1675">&#171;Ajustes b&#225;sicos&#187; o un perfil</text><polygon fill="#182327" points="169.9998,332.9331,323.3093,332.9331,335.3093,349.0317,323.3093,365.1304,169.9998,365.1304,157.9998,349.0317,169.9998,332.9331" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.7578" x="169.9998" y="346.0649">Para cada ajuste: &#191;qu&#233;</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.3096" x="169.9998" y="362.1636">muestra el perfil debajo?</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="113.4893" x="17" y="434.2808"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.4893" x="29" y="459.4126">El valor propio</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.917" x="29" y="475.5112">del perfil</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="115.041" x="150.4893" y="419.332"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.041" x="162.4893" y="444.4639">El valor b&#225;sico</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="115.041" x="314.0078" y="434.2808"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.041" x="326.0078" y="459.4126">El valor b&#225;sico</text><polygon fill="#182327" points="246.6545,510.478,246.6545,510.478,258.6545,522.478,246.6545,534.478,246.6545,534.478,234.6545,522.478,246.6545,510.478" style="stroke:#5BB3C0;stroke-width:1.25;"/><path d="M384.4919,544.478 L384.4919,597.7986 L364.4919,601.7986 L384.4919,605.7986 L384.4919,659.1191 A0,0 0 0 0 384.4919,659.1191 L603.4753,659.1191 A0,0 0 0 0 603.4753,659.1191 L603.4753,554.478 L593.4753,544.478 L384.4919,544.478 A0,0 0 0 0 384.4919,544.478" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M593.4753,544.478 L593.4753,554.478 L603.4753,554.478 L593.4753,544.478" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.6079" x="390.4919" y="561.6719">Si su texto va a una aplicaci&#243;n</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.9834" x="390.4919" y="576.6206">con otro perfil, DanyWhere rehace</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.9961" x="390.4919" y="591.5693">lo que ese perfil hace distinto:</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.1479" x="390.4919" y="606.5181">transcripci&#243;n, posprocesamiento</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.3442" x="390.4919" y="621.4668">o solo &#171;A&#241;adir al final&#187;. Solo con</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.6733" x="390.4919" y="636.4155">&#171;Elegir perfil seg&#250;n la aplicaci&#243;n&#187;</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317" x="390.4919" y="651.3643">activado.</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="235.6748" x="128.8171" y="581.7493"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.6748" x="140.8171" y="606.8811">El dictado sigue con estos valores</text><ellipse cx="246.6545" cy="690.1191" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="246.6545" cy="690.1191" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="246.6545" x2="246.6545" y1="36" y2="68.3225"/><polygon fill="#5BB3C0" points="242.6545,58.3225,246.6545,68.3225,250.6545,58.3225,246.6545,62.3225" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="152.9412" x2="142.9412" y1="182.9409" y2="182.9409"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="142.9412" x2="142.9412" y1="182.9409" y2="225.1382"/><polygon fill="#5BB3C0" points="138.9412,215.1382,142.9412,225.1382,146.9412,215.1382,142.9412,219.1382" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="340.3679" x2="350.3679" y1="182.9409" y2="182.9409"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="350.3679" x2="350.3679" y1="182.9409" y2="231.937"/><polygon fill="#5BB3C0" points="346.3679,221.937,350.3679,231.937,354.3679,221.937,350.3679,225.937" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="142.9412" x2="142.9412" y1="281.3354" y2="312.9331"/><polygon fill="#5BB3C0" points="138.9412,302.9331,142.9412,312.9331,146.9412,302.9331,142.9412,306.9331" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="350.3679" x2="350.3679" y1="288.1343" y2="312.9331"/