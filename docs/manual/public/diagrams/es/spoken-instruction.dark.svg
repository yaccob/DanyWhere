<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="863px" preserveAspectRatio="none" style="width:569px;height:863px;" version="1.1" viewBox="0 0 569 863" width="569px" zoomAndPan="magnify"><defs/><g><ellipse cx="224.2891" cy="26" fill="#CFE9ED" rx="10" ry="10" style="stroke:#CFE9ED;stroke-width:1;"/><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="229.4609" x="109.5586" y="56"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="205.4609" x="121.5586" y="81.1318">Un atajo de inicio o de mantener:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.2129" x="121.5586" y="97.2305">la grabaci&#243;n est&#225; en curso</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="108.0342" x="170.272" y="132.1973"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0342" x="182.272" y="157.3291">Dices el texto</text><path d="M377.6851,200.4458 L377.6851,216.3945 L357.6851,220.3945 L377.6851,224.3945 L377.6851,240.3433 A0,0 0 0 0 377.6851,240.3433 L503.4595,240.3433 A0,0 0 0 0 503.4595,240.3433 L503.4595,210.4458 L493.4595,200.4458 L377.6851,200.4458 A0,0 0 0 0 377.6851,200.4458" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M493.4595,200.4458 L493.4595,210.4458 L503.4595,210.4458 L493.4595,200.4458" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.6162" x="383.6851" y="217.6396">Esc cancela todo,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.7744" x="383.6851" y="232.5884">texto e instrucci&#243;n</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="266.792" x="90.8931" y="192.2959"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.3232" x="102.8931" y="217.4277">Un atajo de instrucci&#243;n, p. ej. &#8677;:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="242.792" x="102.8931" y="233.5264">la superposici&#243;n muestra &#171;Instrucci&#243;n&#187;</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="416.5781" x="17" y="268.4932"/><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="144.6064" x="29" y="378.2397"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.3926" x="41" y="403.3716">El modelo de voz</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.3857" x="41" y="419.4702">transcribe el texto,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.0615" x="41" y="435.5688">y la superposici&#243;n</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.6064" x="41" y="451.6675">muestra una marca</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="129.0479" x="243.7373" y="294.4932"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.793" x="255.7373" y="319.625">Dices la</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.0479" x="255.7373" y="335.7236">instrucci&#243;n, p. ej.</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.3789" x="255.7373" y="351.8223">&#171;trad&#250;celo</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.8271" x="255.7373" y="367.9209">al polaco&#187;</text><polygon fill="#182327" points="271.6787,417.8877,344.8438,417.8877,356.8438,433.9863,344.8438,450.085,271.6787,450.085,259.6787,433.9863,271.6787,417.8877" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.9238" x="271.6787" y="431.0195">&#191;Tocado o</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.165" x="271.6787" y="447.1182">mantenido?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.0317" x="220.647" y="431.2314">tocado</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.709" x="356.8438" y="431.2314">mantenido</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="76.1445" x="211.6064" y="460.085"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.1445" x="223.6064" y="485.2168">Un atajo</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.0342" x="223.6064" y="501.3154">de fin lo</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.248" x="223.6064" y="517.4141">env&#237;a</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="85.4688" x="324.1094" y="460.085"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.4688" x="336.1094" y="485.2168">Al soltarlo</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.9238" x="336.1094" y="501.3154">se env&#237;a</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="416.5781" x="17" y="570.3809"/><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="282.3438" x="83.1172" y="596.3809"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="258.3438" x="95.1172" y="621.5127">El modelo de voz transcribe la instrucci&#243;n</text><path d="M378.0645,657.155 L378.0645,680.5781 L358.0645,684.5781 L378.0645,688.5781 L378.0645,712.0012 A0,0 0 0 0 378.0645,712.0012 L551.5225,712.0012 A0,0 0 0 0 551.5225,712.0012 L551.5225,667.155 L541.5225,657.155 L378.0645,657.155 A0,0 0 0 0 378.0645,657.155" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M541.5225,657.155 L541.5225,667.155 L551.5225,667.155 L541.5225,657.155" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1943" x="384.0645" y="674.3489">Nada dicho tras el atajo:</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.458" x="384.0645" y="689.2976">solo los prompts. Sin texto</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.9644" x="384.0645" y="704.2463">antes: solo la instrucci&#243;n.</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="267.5508" x="90.5137" y="656.4795"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="243.5508" x="102.5137" y="681.6113">Posprocesamiento: los prompts activos</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.5439" x="102.5137" y="697.71">del perfil y luego la instrucci&#243;n</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="245.0195" x="101.7793" y="732.6768"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.0195" x="113.7793" y="757.8086">&#171;A&#241;adir al final&#187; del final, se inserta</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.4336" x="113.7793" y="773.9072">y se guarda en el &#171;Historial&#187;</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.165" x="113.7793" y="790.0059">con la instrucci&#243;n</text><ellipse cx="224.2891" cy="835.9727" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="224.2891" cy="835.9727" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="224.2891" x2="224.2891" y1="36" y2="56"/><polygon fill="#5BB3C0" points="220.2891,46,224.2891,56,228.2891,46,224.2891,50" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="224.2891" x2="224.2891" y1="112.1973" y2="132.1973"/><polygon fill="#5BB3C0" points="220.2891,122.1973,224.2891,132.1973,228.2891,122.1973,224.2891,126.1973" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="224.2891" x2="224.2891" y1="172.2959" y2="192.2959"/><polygon fill="#5BB3C0" points="220.2891,182.2959,224.2891,192.2959,228.2891,182.2959,224.2891,186.2959" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="259.6787" x2="249.6787" y1="433.9863" y2="433.9863"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="249.6787" x2="249.6787" y1="433.9863" y2="460.085"/><polygon fill="#5BB3C0" points="245.6787,450.085,249.6787,460.085,253.6787,450.085,249.6787,454.085" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="356.8438" x2="366.8438" y1="433.9863" y2="433.9863"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="366.8438" x2="366.8438" y1="433.9863" y2="460.085"/><polygon fill="#5BB3C0" points="362.8438,450.085,366.8438,460.085,370.8438,450.085,366.8438,454.085" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="249.6787" x2="249.6787" y1="532.3809" y2="550.3809"/><polygon fill="#5BB3C0" points="245.6787,540.3809,249.6787,550.3809,253.6787,540.3809,249.6787,544.3809" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="366.8438" x2="366.8438" y1="516.2822" y2="550.3809"/><polygon fill