nt-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1162" x="363.8232" y="232.5884">text and instruction</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="215.4199" x="122.4033" y="192.2959"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.4199" x="134.4033" y="217.4277">An instruction shortcut, e.g. &#8677;:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.8545" x="134.4033" y="233.5264">the overlay shows &#8220;Instruction&#8221;</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="428.2266" x="17" y="268.4932"/><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="150.8203" x="29" y="378.2397"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.1787" x="41" y="403.3716">The speech model</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.165" x="41" y="419.4702">transcribes the text,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.6201" x="41" y="435.5688">then the overlay</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.8203" x="41" y="451.6675">shows a check mark</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="118.9375" x="260.0547" y="294.4932"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.5098" x="272.0547" y="319.625">You speak the</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9375" x="272.0547" y="335.7236">instruction, e.g.</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0342" x="272.0547" y="351.8223">&#8220;translate this</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.2549" x="272.0547" y="367.9209">into Polish&#8221;</text><polygon fill="#182327" points="294.2271,417.8877,344.8198,417.8877,356.8198,433.9863,344.8198,450.085,294.2271,450.085,282.2271,433.9863,294.2271,417.8877" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.4824" x="294.2271" y="431.0195">Tapped</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.5928" x="294.2271" y="447.1182">or held?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.7617" x="242.4653" y="431.2314">tapped</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5781" x="356.8198" y="431.2314">held</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="91.7031" x="217.8203" y="460.085"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.3721" x="229.8203" y="485.2168">An end</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.7998" x="229.8203" y="501.3154">shortcut</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.7031" x="229.8203" y="517.4141">sends it off</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="91.7031" x="329.5234" y="460.085"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.4961" x="341.5234" y="485.2168">Letting go</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.7031" x="341.5234" y="501.3154">sends it off</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="428.2266" x="17" y="570.3809"/><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="302.585" x="78.8208" y="596.3809"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="278.585" x="90.8208" y="621.5127">The speech model transcribes the instruction</text><path d="M372.001,657.155 L372.001,680.5781 L352.001,684.5781 L372.001,688.5781 L372.001,712.0012 A0,0 0 0 0 372.001,712.0012 L567.1616,712.0012 A0,0 0 0 0 567.1616,712.0012 L567.1616,667.155 L557.1616,657.155 L372.001,657.155 A0,0 0 0 0 372.001,657.155" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M557.1616,657.155 L557.1616,667.155 L567.1616,667.155 L557.1616,657.155" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.0298" x="378.001" y="674.3489">Nothing said after the key:</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.4707" x="378.001" y="689.2976">the prompts alone. No text</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.1606" x="378.001" y="704.2463">before it: the instruction alone.</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="243.7754" x="108.2256" y="656.4795"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.7754" x="120.2256" y="681.6113">Post-processing: the profile's active</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.6475" x="120.2256" y="697.71">prompts, then the instruction</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="252.751" x="103.7378" y="732.6768"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.0029" x="115.7378" y="757.8086">The end's &#8220;Append&#8221;, inserted,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.751" x="115.7378" y="773.9072">saved in &#8220;History&#8221; with the instruction</text><ellipse cx="230.1133" cy="819.874" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="230.1133" cy="819.874" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="230.1133" x2="230.113