<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1460px" preserveAspectRatio="none" style="width:677px;height:1460px;" version="1.1" viewBox="0 0 677 1460" width="677px" zoomAndPan="magnify"><defs/><g><ellipse cx="233.4973" cy="26" fill="#1E3A44" rx="10" ry="10" style="stroke:#1E3A44;stroke-width:1;"/><path d="M354.9797,48.6262 L354.9797,72.0493 L334.9797,76.0493 L354.9797,80.0493 L354.9797,103.4724 A0,0 0 0 0 354.9797,103.4724 L659.2566,103.4724 A0,0 0 0 0 659.2566,103.4724 L659.2566,58.6262 L649.2566,48.6262 L354.9797,48.6262 A0,0 0 0 0 354.9797,48.6262" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M649.2566,48.6262 L649.2566,58.6262 L659.2566,58.6262 L649.2566,48.6262" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.2578" x="360.9797" y="65.8201">The profile: the application in front decides</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1924" x="360.9797" y="80.7688">(&#8220;Choose Profile by Application&#8221;), else the one</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.2769" x="360.9797" y="95.7175">&#8220;In Use&#8221;. Chosen again when the recording ends.</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="202.9648" x="132.0149" y="56"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.9648" x="144.0149" y="81.1318">Press a start or hold shortcut</text><path d="M364.7141,124.1479 L364.7141,147.571 L344.7141,151.571 L364.7141,155.571 L364.7141,178.9941 A0,0 0 0 0 364.7141,178.9941 L605.4065,178.9941 A0,0 0 0 0 605.4065,178.9941 L605.4065,134.1479 L595.4065,124.1479 L364.7141,124.1479 A0,0 0 0 0 364.7141,124.1479" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M595.4065,124.1479 L595.4065,134.1479 L605.4065,134.1479 L595.4065,124.1479" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.6924" x="370.7141" y="141.3418">How it can end, what the end decides,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9497" x="370.7141" y="156.2905">and the spoken instruction: see</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.1162" x="370.7141" y="171.2393">&#8220;How a recording ends&#8221;</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="222.4336" x="122.2805" y="123.4724"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="198.4336" x="134.2805" y="148.6042">The recording runs: start sound,</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.0889" x="134.2805" y="164.7029">the overlay shows the level</text><polygon fill="#FFFFFF" points="179.408,208.822,287.5867,208.822,299.5867,220.822,287.5867,232.822,179.408,232.822,167.408,220.822,179.408,208.822" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.1787" x="179.408" y="225.9045">How does it end?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.2407" x="39.4963" y="203.1184">an end shortcut, or a</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.9116" x="39.4963" y="218.0671">hold shortcut released</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.1499" x="299.5867" y="203.1184">&#8220;Cancel Shortcut&#8221;</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="30.3291" x="299.5867" y="218.0671">(Esc)</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="224.0059" x="17" y="242.822"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.0059" x="29" y="267.9539">The recording stops: stop sound</text><rect fill="#FDECEC" height="56.1973" rx="10" ry="10" style="stroke:#DC2626;stroke-width:1.25;" width="153.9717" x="261.0059" y="242.822"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.9717" x="273.0059" y="267.9539">Cancelled: nothing is</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.9443" x="273.0059" y="284.0525">transcribed or kept</text><ellipse cx="337.9917" cy="330.0193" fill="none" rx="11" ry="11" style="stroke:#1E3A44;stroke-width:1;"/><ellipse cx="337.9917" cy="330.0193" fill="#1E3A44" rx="6" ry="6" style="stroke:#1E3A44;stroke-width:1;"/><path d="M359.2659,361.1199 L359.2659,377.0686 L339.2659,381.0686 L359.2659,385.0686 L359.2659,401.0173 A0,0 0 0 0 359.2659,401.0173 L586.9011,401.0173 A0,0 0 0 0 586.9011,401.0173 L586.9011,371.1199 L576.9011,361.1199 L359.2659,361.1199 A0,0 0 0 0 359.2659,361.1199" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M576.9011,361.1199 L576.9011,371.1199 L586.9011,371.1199 L576.9011,361.1199" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6353" x="365.2659" y="378.3137">Word lists: a model that takes them,</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.918" x="365.2659" y="393.2625">such as Whisper, uses them here</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="211.5371" x="127.7288" y="361.0193"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.5371" x="139.7288" y="386.1511">The speech model transcribes</text><rect fill="#E7F3F5" height="56.1973" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="220.8545" x="123.0701" y="536.4612"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.8545" x="135.0701" y="561.593">Earlier dictations from the same</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.999" x="135.0701" y="577.6917">window go along as context</text><polygon fill="#FFFFFF" points="186.4182,478.7896,280.5764,478.7896,292.5764,494.8882,280.5764,510.9868,186.4182,510.9868,174.4182,494.8882,186.4182,478.7896" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.23" x="237.4973" y="523.1807">yes</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.1582" x="186.4182" y="491.9214">&#8220;Send Context&#8221;</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.0479" x="186.4182" y="508.02">for this end?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="292.5764" y="492.1333">no</text><path d="M372.0901,658.907 L372.0901,674.8557 L352.0901,678.8557 L372.0901,682.8557 L372.0901,698.8044 A0,0 0 0 0 372.0901,698.8044 L569.3962,698.8044 A0,0 0 0 0 569.3962,698.8044 L569.3962,668.907 L559.3962,658.907 L372.0901,658.907 A0,0 0 0 0 372.0901,658.907" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><path d="M559.3962,658.907 L559.3962,668.907 L569.3962,668.907 L559.3962,658.907" fill="#F3F5F5" style="stroke:#C9D6D9;stroke-width:1;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.3062" x="378.0901" y="676.1008">If it fails, the transcript goes on</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.9707" x="378.0901" y="691.0496">as it is, and a notice says why</text><rect fill="#E7F3F5" height="88.3945" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="237.1855" x="114.9045" y="634.6584"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.3232" x="126.9045" y="659.7903">The post-processing model edits</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.8682" x="126.9045" y="675.8889">the text: the active prompts in</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.7783" x="126.9045" y="691.9875">their order, the spoken instruction</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.1855" x="126.9045" y="708.0862">last, the word lists as known terms</text><polygon fill="#FFFFFF" points="118.3494,421.1179,348.6453,421.1179,360.6453,437.2166,348.6453,453.3152,118.3494,453.3152,106.3494,437.2166,118.3494,421.1179" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.23" x="237.4973" y="465.509">yes</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.0957" x="118.3494" y="434.2498">An instruction shortcut pressed,</text><text fill="#1E3A44" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="230.2959" x="118.3494" y="450.3484">or &#8220;Post Processing&#8221; set to &#8220;Always&#8221;?</text><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="360.6453" y="434.4617">no</text><rect fill="#E7F3F5" height="40.0986" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="135.2549" x="165.8699" y="765.053"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.2549" x="177.8699" y="790.1848">Saved in &#8220;History&#8221;</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="184.2754" x="204.6023" y="855.0491"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.3789" x="216.6023" y="880.1809">It waits until a macOS</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.2754" x="216.6023" y="896.2795">service inserts it, e.g. with</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.5996" x="216.6023" y="912.3782">&#8220;Paste Last Transcript&#8221;</text><rect fill="#E7F3F5" height="72.2959" rx="10" ry="10" style="stroke:#3C9CAA;stroke-width:1.25;" width="182.71" x="205.385" y="977.2424"/><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.5303" x="217.385" y="1002.3743">On the clipboard, or only</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.71" x="217.385" y="1018.4729">in &#8220;History&#8221;, as &#8220;Clipboard</text><text fill="#0F0F0F" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.5996" x="217.385" y="1034.5715">Handling&#8221; says</text><polygon fill="#FFFFFF" points="95.5378,825.1516,177.1814,825.1516,189.1814,840.1003,177.1814,855.0491,95.5378,855.0491,83.5378,840.1003,95.5378,825.1516" style="stroke:#3C9CAA;stroke-width:1.25;"/><text fill="#3D5257" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="81.6436" x="95.5378" y="837.3455">A Mac without</text><text fill="#3D5257" font-fa