n end</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.7998" x="542.8652" y="466.1926">shortcut</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="41.248" x="542.8652" y="482.2913">ends it</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="111.9238" x="624.665" y="424.9622"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.1514" x="636.665" y="450.094">Releasing it</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.9238" x="636.665" y="466.1926">ends it with its</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.041" x="636.665" y="482.2913">own values</text><rect fill="#3D2224" height="88.3945" rx="10" ry="10" style="stroke:#F87171;stroke-width:1.25;" width="93.2549" x="746.5889" y="274.3191"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1514" x="758.5889" y="299.4509">Cancelled:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.9307" x="758.5889" y="315.5496">nothing is</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.2549" x="758.5889" y="331.6482">transcribed</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.7998" x="758.5889" y="347.7468">or kept</text><ellipse cx="793.2163" cy="408.7136" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="793.2163" cy="408.7136" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><polygon fill="#182327" points="436.4795,525.2581,436.4795,525.2581,448.4795,537.2581,436.4795,549.2581,436.4795,549.2581,424.4795,537.2581,436.4795,525.2581" style="stroke:#5BB3C0;stroke-width:1.25;"/><polygon fill="#182327" points="338.4316,569.2581,534.5273,569.2581,546.5273,593.406,534.5273,617.554,338.4316,617.554,326.4316,593.406,338.4316,569.2581" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.0957" x="338.4316" y="582.3899">An instruction shortcut pressed,</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.3857" x="338.4316" y="598.4885">or &#8220;Post Processing&#8221; set</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.0205" x="338.4316" y="614.5872">to &#8220;Always&#8221;?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.23" x="306.2017" y="590.6511">yes</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="546.5273" y="590.6511">no</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="225.0996" x="203.8818" y="627.554"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.0996" x="215.8818" y="652.6858">Post-processed with the profile's</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.668" x="215.8818" y="668.7844">active prompts and the spoken</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6338" x="215.8818" y="684.8831">instruction, if there is one</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="182.7305" x="225.0664" y="777.5215"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.7305" x="237.0664" y="802.6533">Earlier dictations from the</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.4199" x="237.0664" y="818.752">same window go along</text><polygon fill="#182327" points="259.6216,719.8499,373.2417,719.8499,385.2417,735.9485,373.2417,752.0471,259.6216,752.0471,247.6216,735.9485,259.6216,719.8499" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.23" x="320.4316" y="764.241">yes</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.6201" x="259.6216" y="732.9817">&#8220;Send Context&#8221; on</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.0479" x="259.6216" y="749.0803">for this end?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="385.2417" y="733.1936">no</text><rect fill="#262B2D" he