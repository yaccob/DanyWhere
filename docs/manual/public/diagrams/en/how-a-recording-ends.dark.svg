<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="868px" preserveAspectRatio="none" style="width:682px;height:868px;" version="1.1" viewBox="0 0 682 868" width="682px" zoomAndPan="magnify"><defs/><g><ellipse cx="340.5327" cy="26" fill="#CFE9ED" rx="10" ry="10" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M70.5981,56 L70.5981,125.7949 L267.1743,125.7949 L267.1743,66 L257.1743,56 L70.5981,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M257.1743,56 L257.1743,66 L267.1743,66 L257.1743,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.5044" x="76.5981" y="73.1938">&#8220;Copy Last Transcript&#8221; ends it</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.5762" x="76.5981" y="88.1426">too, as its start shortcut would,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.8779" x="76.5981" y="103.0913">and puts the text on the</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.2871" x="76.5981" y="118.04">clipboard instead</text><path d="M413.8911,63.4744 L413.8911,118.3206 L597.7974,118.3206 L597.7974,73.4744 L587.7974,63.4744 L413.8911,63.4744" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M587.7974,63.4744 L587.7974,73.4744 L597.7974,73.4744 L587.7974,63.4744" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.8535" x="419.8911" y="80.6682">On Linux, an end shortcut's</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.9063" x="419.8911" y="95.6169">own combination isn't taken,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.2881" x="419.8911" y="110.5657">and Esc doesn't cancel</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="126.7168" x="277.1743" y="70.8481"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.7168" x="289.1743" y="95.98">A recording runs</text><polygon fill="#182327" points="297.7329,155.7949,383.3325,155.7949,395.3325,167.7949,383.3325,179.7949,297.7329,179.7949,285.7329,167.7949,297.7329,155.7949" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.5996" x="297.7329" y="172.8774">What ends it?</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="118.9375" x="17" y="242.3862"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.2617" x="29" y="267.5181">That end</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9375" x="29" y="283.6167">shortcut ends it</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="148.5166" x="155.9375" y="242.3862"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.0615" x="167.9375" y="267.5181">The end shortcut</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.3721" x="167.9375" y="283.6167">with the same</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.5166" x="167.9375" y="299.7153">combination ends it,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0479" x="167.9375" y="315.814">if there is one</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="135.2686" x="339.7866" y="242.3862"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.1514" x="351.7866" y="267.5181">Its end &#8220;When</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.2686" x="351.7866" y="283.6167">Held&#8221; ends it, with</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.3584" x="351.7866" y="299.7153">&#8220;Hold&#8221;, or &#8220;Auto&#8221;</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.0547" x="351.7866" y="315.814">after holding</text><rect fill="#3D2224" height="88.3945" rx="10" ry="10" style="stroke:#F87171;stroke-width:1.25;" width="93.2549" x="530.7544" y="242.3862"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1514" x="542.7544" y="267.5181">Cancelled:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.9307" x="542.7544" y="283.6167">nothing is</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.2549" x="542.7544" y="299.7153">transcribed</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.7998" x="542.7544" y="315.814">or kept</text><ellipse cx="577.3818" cy="361.7808" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="577.3818" cy="361.7808" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><polygon fill="#182327" points="340.5327,382.7808,340.5327,382.7808,352.5327,394.7808,340.5327,406.7808,340.5327,406.7808,328.5327,394.7808,340.5327,382.7808" style="stroke:#5BB3C0;stroke-width:1.25;"/><polygon fill="#182327" points="246.771,426.7808,434.2944,426.7808,446.2944,450.9287,434.2944,475.0767,246.771,475.0767,234.771,450.9287,246.771,426.7808" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.5234" x="246.771" y="439.9126">&#8220;Post-process&#8221; on for this end,</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.1924" x="246.771" y="456.0112">and &#8220;Post Processing&#8221; on</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0547" x="246.771" y="472.1099">in the profile?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.23" x="214.541" y="448.1738">yes</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="446.2944" y="448.1738">no</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="173.4063" x="138.0679" y="485.0767"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.4063" x="150.0679" y="510.2085">Post-processed with the</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.7275" x="150.0679" y="526.3071">profile's active prompts</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="182.7305" x="133.4058" y="618.9456"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.7305" x="145.4058" y="644.0774">Earlier dictations from the</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.4199" x="145.4058" y="660.176">same window go along</text><polygon fill="#182327" points="167.9609,561.2739,281.5811,561.2739,293.5811,577.3726,281.5811,593.4712,167.9609,593.4712,155.9609,577.3726,167.9609,561.2739" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.23" x="228.771" y="605.665">yes</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.6201" x="167.9609" y="574.4058">&#8220;Send Context&#8221; on</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.0479" x="167.9609" y="590.5044">for this end?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="293.5811" y="574.6177">no</text><rect fill="#262B2D" height="56.1973" rx="10" ry="10" style="stroke:#6D7E82;stroke-width:1.25;" width="149.2822" x="381.6533" y="485.0767"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.2822" x="393.6533" y="510.2085">Not post-processed,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.5996" x="393.6533" y="526.3071">no context</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="221.6748" x="229.6953" y="737.1428"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.6748" x="241.6953" y="762.2747">&#8220;Append&#8221;: its text is added, then</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.7236" x="241.6953" y="778.3733">its key press, which is sent</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.7715" x="241.6953" y="794.4719">only when the text is pasted</text><ellipse cx="340.5327" cy="840.4387" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="340.5327" cy="840.4387" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="340.5327" x2="340.5327" y1="36" y2="70.8481"/><polygon fill="#5BB3C0" points="336.5327,60.8481,340.5327,70.8481,344.5327,60.8481,3