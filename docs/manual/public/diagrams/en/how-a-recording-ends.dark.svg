<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1027px" preserveAspectRatio="none" style="width:863px;height:1027px;" version="1.1" viewBox="0 0 863 1027" width="863px" zoomAndPan="magnify"><defs/><g><ellipse cx="436.4795" cy="26" fill="#CFE9ED" rx="10" ry="10" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M166.5449,56 L166.5449,125.7949 L363.1211,125.7949 L363.1211,66 L353.1211,56 L166.5449,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M353.1211,56 L353.1211,66 L363.1211,66 L353.1211,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.5044" x="172.5449" y="73.1938">&#8220;Copy Last Transcript&#8221; ends it</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.5762" x="172.5449" y="88.1426">too, as its start shortcut would,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.8779" x="172.5449" y="103.0913">and puts the text on the</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.2871" x="172.5449" y="118.04">clipboard instead</text><path d="M509.8379,56 L509.8379,125.7949 L724.0923,125.7949 L724.0923,66 L714.0923,56 L509.8379,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M714.0923,56 L714.0923,66 L724.0923,66 L714.0923,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.8535" x="515.8379" y="73.1938">On Linux, no end shortcut's</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.5825" x="515.8379" y="88.1426">own combination is taken,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.9644" x="515.8379" y="103.0913">there are no instruction</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.2544" x="515.8379" y="118.04">shortcuts, and Esc doesn't cancel</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="126.7168" x="373.1211" y="70.8481"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.7168" x="385.1211" y="95.98">A recording runs</text><polygon fill="#182327" points="393.6797,155.7949,479.2793,155.7949,491.2793,167.7949,479.2793,179.7949,393.6797,179.7949,381.6797,167.7949,393.6797,155.7949" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.5996" x="393.6797" y="172.8774">What ends it?</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="79.2617" x="17" y="274.3191"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.2617" x="29" y="299.4509">That end</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.7998" x="29" y="315.5496">shortcut</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="41.248" x="29" y="331.6482">ends it</text><rect fill="#1D3A40" height="120.5918" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="102.5859" x="116.4854" y="274.3191"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="128.4854" y="299.4509">The end</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.5859" x="128.4854" y="315.5496">shortcut with</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5859" x="128.4854" y="331.6482">the same</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.4893" x="128.4854" y="347.7468">combination</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.0273" x="128.4854" y="363.8455">ends it, if</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.1582" x="128.4854" y="379.9441">there is one</text><path d="M369.2954,276.1445 L369.2954,314.5164 L349.2954,318.5164 L369.2954,322.5164 L369.2954,360.8882 A0,0 0 0 0 369.2954,360.8882 L500.8652,360.8882 A0,0 0 0 0 500.8652,360.8882 L500.8652,286.1445 L490.8652,276.1445 L369.2954,276.1445 A0,0 0 0 0 369.2954,276.1445" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M490.8652,276.1445 L490.8652,286.1445 L500.8652,286.1445 L490.8652,276.1445" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.7935" x="375.2954" y="293.3384">Released at once,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.5698" x="375.2954" y="308.2871">a hold shortcut that</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.9082" x="375.2954" y="323.2358">isn't also a start</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.2617" x="375.2954" y="338.1846">shortcut discards</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.8799" x="375.2954" y="353.1333">the recording</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="83.4727" x="265.8228" y="274.3191"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.3721" x="277.8228" y="299.4509">That hold</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.4727" x="277.8228" y="315.5496">shortcut's</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.4688" x="277.8228" y="331.6482">values</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.248" x="277.8228" y="347.7468">end it</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="151.6133" x="548.3894" y="259.3704"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-seri