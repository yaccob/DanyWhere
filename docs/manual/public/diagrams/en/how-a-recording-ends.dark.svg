<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="868px" preserveAspectRatio="none" style="width:715px;height:868px;" version="1.1" viewBox="0 0 715 868" width="715px" zoomAndPan="magnify"><defs/><g><ellipse cx="357.4124" cy="26" fill="#CFE9ED" rx="10" ry="10" style="stroke:#CFE9ED;stroke-width:1;"/><path d="M87.4778,56 L87.4778,125.7949 L284.054,125.7949 L284.054,66 L274.054,56 L87.4778,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M274.054,56 L274.054,66 L284.054,66 L274.054,56" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.5044" x="93.4778" y="73.1938">&#8220;Copy Last Transcript&#8221; ends it</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.5762" x="93.4778" y="88.1426">too, as its start shortcut would,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.8779" x="93.4778" y="103.0913">and puts the text on the</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.2871" x="93.4778" y="118.04">clipboard instead</text><path d="M430.7708,63.4744 L430.7708,118.3206 L614.677,118.3206 L614.677,73.4744 L604.677,63.4744 L430.7708,63.4744" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><path d="M604.677,63.4744 L604.677,73.4744 L614.677,73.4744 L604.677,63.4744" fill="#262B2D" style="stroke:#4B5759;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.8535" x="436.7708" y="80.6682">On Linux, an end shortcut's</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.9063" x="436.7708" y="95.6169">own combination isn't taken,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.2881" x="436.7708" y="110.5657">and Esc doesn't cancel</text><rect fill="#1D3A40" height="40.0986" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="126.7168" x="294.054" y="70.8481"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.7168" x="306.054" y="95.98">A recording runs</text><polygon fill="#182327" points="314.6125,155.7949,400.2122,155.7949,412.2122,167.7949,400.2122,179.7949,314.6125,179.7949,302.6125,167.7949,314.6125,155.7949" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.5996" x="314.6125" y="172.8774">What ends it?</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="118.9375" x="17" y="242.3862"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.2617" x="29" y="267.5181">That end</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.9375" x="29" y="283.6167">shortcut ends it</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="148.5166" x="189.6968" y="242.3862"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.0615" x="201.6968" y="267.5181">The end shortcut</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.3721" x="201.6968" y="283.6167">with the same</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.5166" x="201.6968" y="299.7153">combination ends it,</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0479" x="201.6968" y="315.814">if there is one</text><rect fill="#1D3A40" height="88.3945" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="135.2686" x="373.5459" y="242.3862"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.1514" x="385.5459" y="267.5181">Its end &#8220;When</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.2686" x="385.5459" y="283.6167">Held&#8221; ends it, with</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.3584" x="385.5459" y="299.7153">&#8220;Hold&#8221;, or &#8220;Auto&#8221;</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.0547" x="385.5459" y="315.814">after holding</text><rect fill="#3D2224" height="88.3945" rx="10" ry="10" style="stroke:#F87171;stroke-width:1.25;" width="93.2549" x="564.5137" y="242.3862"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1514" x="576.5137" y="267.5181">Cancelled:</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.9307" x="576.5137" y="283.6167">nothing is</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.2549" x="576.5137" y="299.7153">transcribed</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.7998" x="576.5137" y="315.814">or kept</text><ellipse cx="611.1411" cy="361.7808" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="611.1411" cy="361.7808" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><polygon fill="#182327" points="357.4124,382.7808,357.4124,382.7808,369.4124,394.7808,357.4124,406.7808,357.4124,406.7808,345.4124,394.7808,357.4124,382.7808" style="stroke:#5BB3C0;stroke-width:1.25;"/><polygon fill="#182327" points="263.6506,426.7808,451.1741,426.7808,463.1741,450.9287,451.1741,475.0767,263.6506,475.0767,251.6506,450.9287,263.6506,426.7808" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.5234" x="263.6506" y="439.9126">&#8220;Post-process&#8221; on for this end,</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.1924" x="263.6506" y="456.0112">and &#8220;Post Processing&#8221; on</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0547" x="263.6506" y="472.1099">in the profile?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.23" x="231.4207" y="448.1738">yes</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="463.1741" y="448.1738">no</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="173.4063" x="154.9475" y="485.0767"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.4063" x="166.9475" y="510.2085">Post-processed with the</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.7275" x="166.9475" y="526.3071">profile's active prompts</text><rect fill="#1D3A40" height="56.1973" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="182.7305" x="150.2854" y="618.9456"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.7305" x="162.2854" y="644.0774">Earlier dictations from the</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.4199" x="162.2854" y="660.176">same window go along</text><polygon fill="#182327" points="184.8406,561.2739,298.4607,561.2739,310.4607,577.3726,298.4607,593.4712,184.8406,593.4712,172.8406,577.3726,184.8406,561.2739" style="stroke:#5BB3C0;stroke-width:1.25;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.23" x="245.6506" y="605.665">yes</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.6201" x="184.8406" y="574.4058">&#8220;Send Context&#8221; on</text><text fill="#CFE9ED" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.0479" x="184.8406" y="590.5044">for this end?</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="310.4607" y="574.6177">no</text><rect fill="#262B2D" height="56.1973" rx="10" ry="10" style="stroke:#6D7E82;stroke-width:1.25;" width="149.2822" x="398.533" y="485.0767"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.2822" x="410.533" y="510.2085">Not post-processed,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.5996" x="410.533" y="526.3071">no context</text><rect fill="#1D3A40" height="72.2959" rx="10" ry="10" style="stroke:#5BB3C0;stroke-width:1.25;" width="221.6748" x="246.575" y="737.1428"/><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.6748" x="258.575" y="762.2747">&#8220;Append&#8221;: its text is added, then</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.7236" x="258.575" y="778.3733">its key press, which is sent</text><text fill="#F2F6F7" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.7715" x="258.575" y="794.4719">only when the text is pasted</text><ellipse cx="357.4124" cy="840.4387" fill="none" rx="11" ry="11" style="stroke:#CFE9ED;stroke-width:1;"/><ellipse cx="357.4124" cy="840.4387" fill="#CFE9ED" rx="6" ry="6" style="stroke:#CFE9ED;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="357.4124" x2="357.4124" y1="36" y2="70.8481"/><polygon fill="#5BB3C0" points="353.4124,60.8481,357.4124,70.8481,361.4124,60.8481,357.4124,64.8481" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="611.1411" x2="611.1411" y1="330.7808" y2="350.7808"/><polygon fill="#5BB3C0" points="607.1411,340.7808,611.1411,350.7808,615.1411,340.7808,611.1411,344.7808" style="stroke:#5BB3C0;stroke-width:1;"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="302.6125" x2="76.4688" y1="167.7949" y2="167.7949"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="76.4688" x2="76.4688" y1="167.7949" y2="242.3862"/><polygon fill="#5BB3C0" points="72.4688,232.3862,76.4688,242.3862,80.4688,232.3862,76.4688,236.3862" style="stroke:#5BB3C0;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.228" x="76.4688" y="205.9375">an end shortcut,</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.7617" x="76.4688" y="220.8862">tapped</text><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="412.2122" x2="611.1411" y1="167.7949" y2="167.7949"/><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="611.1411" x2="611.1411" y1="167.7949" y2="242.3862"/><polygon fill="#5BB3C0" points="607.1411,232.3862,611.1411,242.3862,615.1411,232.3862,611.1411,236.3862" style="stroke:#5BB3C0;stroke-width:1;"/><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.7954" x="611.1411" y="205.9375">&#8220;Cancel</text><text fill="#C3D3D6" font-family="Arial, Helvetica, 'Liberation Sans', 'Arimo', sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.6836" x="611.1411" y="220.8862">Shortcut&#8221; (Esc)</text><line style="stroke:#5BB3C0;stroke-width:1.25;" x1="263.9551" x2="263.9551" y1="167.7949" y2="242.3862"/><polygon fill="#5BB3C0" points="259.9551,232.3862,263.9551,242.3862,267.9551,232.3862,263.9551,236.3862" style